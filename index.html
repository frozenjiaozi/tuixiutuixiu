<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>退休规划</title>
<style>
  :root {
    --bg: #f8fafc;
    --card: rgba(255, 255, 255, 0.92);
    --card-subtle: #f1f5f9;
    --text: #0f172a;
    --text-2: #334155;
    --text-3: #64748b;
    --text-4: #94a3b8;
    --brand: #059669;
    --brand-light: #ecfdf5;
    --brand-hover: #047857;
    --brand-gradient: linear-gradient(135deg, #059669 0%, #0d9488 50%, #10b981 100%);
    --indigo: #6366f1;
    --indigo-light: #eef2ff;
    --amber: #d97706;
    --amber-light: #fffbeb;
    --teal: #0d9488;
    --teal-light: #f0fdfa;
    --rose: #e11d48;
    --rose-light: #fff1f2;
    --line-subtle: #f1f5f9;
    --band: rgba(16, 185, 129, 0.08);
    --radius-bento: 32px;
    --radius-card: 24px;
    --radius-tile: 20px;
    --radius-pill: 9999px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f1f5f9;
    background-image: radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.06), transparent 35%),
                      radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.05), transparent 40%),
                      radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.03), transparent 50%);
    background-attachment: fixed;
    color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  button, input, select { font: inherit; color: inherit; }

  /* App Header 仪表横梁 */
  .top-wrapper {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .top {
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    justify-content: space-between;
  }
  .brand-group {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand-logo {
    width: 48px;
    height: 48px;
    border-radius: 20px;
    background: var(--brand-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    box-shadow: 0 10px 24px -6px rgba(16, 185, 129, 0.45);
    flex-shrink: 0;
  }
  .brand-logo svg {
    width: 24px;
    height: 24px;
  }
  .brand-text h1 {
    font-size: 24px;
    font-weight: 900;
    margin: 0;
    line-height: 1.2;
    letter-spacing: -0.025em;
    color: #0f172a;
  }
  .brand-text .sub {
    color: var(--text-4);
    font-size: 12px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* 顶部动态家庭画像胶囊 */
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  .profile-pill {
    display: none;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(12px);
    padding: 6px 16px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
  }
  @media (min-width: 992px) {
    .profile-pill { display: flex; }
  }
  .profile-pill:hover {
    background: #ffffff;
    transform: scale(1.01);
  }
  .profile-pill-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
  }
  .profile-pill-label {
    font-weight: 700;
    color: var(--text-4);
  }
  .profile-pill-val {
    font-weight: 900;
    color: var(--text);
  }
  .pill-badge {
    font-size: 10px;
    font-weight: 900;
    padding: 1px 6px;
    border-radius: var(--radius-pill);
  }
  .pill-badge.indigo { background: var(--indigo-light); color: var(--indigo); }
  .pill-badge.amber { background: var(--amber-light); color: var(--amber); }
  .pill-badge.rose { background: var(--rose-light); color: var(--rose); }
  .pill-badge.emerald { background: var(--brand-light); color: var(--brand); }
  .pill-badge.slate { background: #f1f5f9; color: var(--text-3); }
  .profile-pill-sep {
    width: 1px;
    height: 12px;
    background: #e2e8f0;
  }

  .btn-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: none;
    border-radius: var(--radius-pill);
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-pill.primary {
    background: var(--brand);
    color: #ffffff;
    box-shadow: 0 6px 18px -4px rgba(16, 185, 129, 0.45);
  }
  .btn-pill.primary:hover {
    background: var(--brand-hover);
    transform: scale(1.02);
  }
  .btn-pill.secondary {
    background: rgba(255, 255, 255, 0.9);
    color: var(--text-2);
  }
  .btn-pill.secondary:hover {
    background: #ffffff;
    color: var(--brand);
    transform: scale(1.02);
  }

  /* 主画卷容器 (100%宽幅单页一体直接滚动) */
  .main-canvas {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 24px 80px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* 快速微调条 (Compact Dials) */
  .dials-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
  }
  .dial-card {
    border-radius: 20px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
    transition: transform 0.15s ease;
  }
  .dial-card:hover {
    transform: translateY(-2px);
  }
  .dial-card.emerald { background: var(--brand-light); }
  .dial-card.indigo { background: var(--indigo-light); }
  .dial-card.amber { background: var(--amber-light); }
  .dial-card.teal { background: var(--teal-light); }

  .dial-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .dial-label {
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dial-card.emerald .dial-label { color: #064e3b; }
  .dial-card.indigo .dial-label { color: #312e81; }
  .dial-card.amber .dial-label { color: #78350f; }
  .dial-card.teal .dial-label { color: #134e4a; }

  .dial-val {
    font-size: 17px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
  }
  .dial-card.emerald .dial-val { color: #064e3b; }
  .dial-card.indigo .dial-val { color: #312e81; }
  .dial-card.amber .dial-val { color: #78350f; }
  .dial-card.teal .dial-val { color: #134e4a; }
  .dial-val span { font-size: 11px; font-weight: 700; opacity: 0.7; }

  .dial-ctrl {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dial-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: #ffffff;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    transition: transform 0.1s ease;
    flex-shrink: 0;
  }
  .dial-btn:hover { transform: scale(1.1); }
  .dial-btn:active { transform: scale(0.95); }
  .dial-card.emerald .dial-btn { color: var(--brand); }
  .dial-card.indigo .dial-btn { color: var(--indigo); }
  .dial-card.amber .dial-btn { color: var(--amber); }
  .dial-card.teal .dial-btn { color: var(--teal); }

  .dial-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.06);
    outline: none;
  }
  .dial-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.2);
    cursor: pointer;
  }
  .dial-card.emerald .dial-slider { accent-color: var(--brand); }
  .dial-card.indigo .dial-slider { accent-color: var(--indigo); }
  .dial-card.amber .dial-slider { accent-color: var(--amber); }
  .dial-card.teal .dial-slider { accent-color: var(--teal); }

  /* Bento 基础卡片 */
  .bento-card {
    background: var(--card);
    border-radius: var(--radius-bento);
    padding: 28px;
    border: none;
  }
  .bento-section {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .bento-header {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bento-icon {
    width: 40px;
    height: 40px;
    border-radius: 16px;
    background: var(--brand-light);
    color: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .bento-icon svg { width: 18px; height: 18px; }
  .bento-title {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.02em;
    color: #0f172a;
    margin: 0;
  }
  .bento-desc {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-4);
    margin: 2px 0 0;
  }

  /* 首屏成就大卡 (Answer Card) */
  .answer-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 28px;
  }
  @media (max-width: 900px) {
    .answer-grid { grid-template-columns: 1fr; }
  }

  .earliest-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--brand-light);
    color: var(--brand);
    padding: 4px 12px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 800;
  }
  .pulse-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--brand);
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
  }
  .earliest-headline {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px;
  }
  .earliest-headline .prefix {
    font-size: 22px;
    font-weight: 900;
    color: #334155;
  }
  .earliest-headline .hero-age {
    font-size: 42px;
    font-weight: 950;
    letter-spacing: -0.03em;
    background: var(--brand-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .earliest-headline .suffix {
    font-size: 22px;
    font-weight: 900;
    color: var(--brand);
  }
  .earliest-meta {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    font-size: 13.5px;
    color: var(--text-3);
  }
  .earliest-meta b {
    color: var(--brand);
    font-weight: 900;
  }

  /* 倒计时药丸块 */
  .countdown-box {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .cd-tile {
    min-width: 60px;
    padding: 10px 12px;
    border-radius: 18px;
    background: #f1f5f9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .cd-tile.sec {
    background: var(--brand);
    color: #ffffff;
    box-shadow: 0 6px 18px -4px rgba(16, 185, 129, 0.5);
  }
  .cd-num {
    font-size: 26px;
    font-weight: 950;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--text);
  }
  .cd-tile.sec .cd-num { color: #ffffff; }
  .cd-unit {
    font-size: 11px;
    font-weight: 800;
    color: var(--text-4);
    margin-top: 4px;
  }
  .cd-tile.sec .cd-unit { color: rgba(255, 255, 255, 0.85); }

  /* 人生进度条 */
  .progress-wrap {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #f1f5f9;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .progress-bar-bg {
    position: relative;
    height: 12px;
    border-radius: 999px;
    background: #f1f5f9;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--brand-gradient);
    transition: width 0.5s ease;
  }
  .progress-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-4);
  }
  .progress-labels .highlight {
    color: var(--text);
  }
  .progress-labels .highlight b {
    color: var(--brand);
    font-weight: 900;
  }

  /* 你的计划目标面板 (Plan Panel) */
  .plan-panel {
    border-radius: 28px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 18px;
  }
  .plan-panel.ok { background: linear-gradient(135deg, #ecfdf5 0%, rgba(240, 253, 250, 0.7) 100%); --plan-label: rgba(6, 78, 59, 0.7); --plan-line: rgba(167, 243, 208, 0.8); --plan-title: #022c22; }
  .plan-panel.fail { background: linear-gradient(135deg, #fff1f2 0%, rgba(255, 251, 235, 0.6) 100%); --plan-label: rgba(136, 19, 55, 0.7); --plan-line: rgba(254, 205, 211, 0.8); --plan-title: #4c0519; }
  .plan-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .plan-tag {
    font-size: 11px;
    font-weight: 900;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .plan-panel.ok .plan-tag { background: #d1fae5; color: #065f46; }
  .plan-panel.fail .plan-tag { background: #ffe4e6; color: #9f1239; }
  .plan-title {
    margin: 8px 0 0;
    font-size: 17px;
    font-weight: 900;
    color: var(--plan-title);
  }
  /* 主数字：退休时需要准备的存款 */
  .plan-need-label { margin: 20px 0 0; font-size: 13px; font-weight: 700; color: var(--plan-label); }
  .plan-need-val { margin: 2px 0 0; display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
  .plan-panel.ok .plan-need-val { color: #047857; }
  .plan-panel.fail .plan-need-val { color: #e11d48; }
  .plan-need-val b { font-size: 56px; font-weight: 950; letter-spacing: -0.03em; line-height: 1; }
  .plan-need-val span { font-size: 20px; font-weight: 900; opacity: 0.8; }

  /* 次要数字：届时拥有、每月最多花（细线分隔，不套卡片） */
  .plan-stats {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--plan-line);
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .plan-stat { min-width: 0; }
  .plan-stat + .plan-stat { padding-left: 16px; border-left: 1px solid var(--plan-line); }
  .plan-stat-label { margin: 0; font-size: 12px; font-weight: 700; color: var(--plan-label); }
  .plan-stat-val { margin: 4px 0 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 4px; font-variant-numeric: tabular-nums; }
  .plan-stat-val b { font-size: 28px; font-weight: 950; letter-spacing: -0.02em; line-height: 1.1; }
  .plan-stat-val b.text { font-size: 15px; }
  .plan-stat-val span { font-size: 12px; font-weight: 800; opacity: 0.75; }
  .plan-panel.ok .plan-stat-val.have { color: #0f766e; }
  .plan-panel.fail .plan-stat-val.have { color: #9f1239; }
  .plan-stat-val.ceil { color: #b45309; }
  .plan-panel .plan-stat-val.danger { color: #e11d48; }

  /* 差额与达成进度 */
  .plan-progress-head { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 12px; }
  .plan-progress-gap { font-weight: 900; }
  .plan-panel.ok .plan-progress-gap { color: var(--brand); }
  .plan-panel.fail .plan-progress-gap { color: var(--rose); }
  .plan-progress-pct { font-weight: 700; color: var(--plan-label); font-variant-numeric: tabular-nums; }
  .plan-progress-bar { height: 10px; border-radius: 999px; overflow: hidden; }
  .plan-panel.ok .plan-progress-bar { background: #d1fae5; }
  .plan-panel.fail .plan-progress-bar { background: #ffe4e6; }
  .plan-progress-bar i { display: block; height: 100%; border-radius: 999px; }
  .plan-panel.ok .plan-progress-bar i { background: linear-gradient(90deg, #10b981, #2dd4bf); }
  .plan-panel.fail .plan-progress-bar i { background: linear-gradient(90deg, #f43f5e, #fb923c); }

  .safety-tip {
    margin-top: 20px;
    border-radius: 20px;
    padding: 14px 18px;
    font-size: 13.5px;
    line-height: 1.6;
  }
  .safety-tip.strong { background: var(--brand-light); color: #064e3b; }
  .safety-tip.warn { background: var(--amber-light); color: #78350f; }

  /* 4 个关键事实便当盒 (KeyFacts) */
  .facts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .fact-card {
    border-radius: 24px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 14px;
    transition: transform 0.15s ease;
  }
  .fact-card:hover { transform: translateY(-2px); }
  .fact-card.emerald { background: var(--brand-light); }
  .fact-card.indigo { background: var(--indigo-light); }
  .fact-card.amber { background: var(--amber-light); }
  .fact-card.teal { background: var(--teal-light); }

  .fact-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .fact-icon-wrap {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fact-card.emerald .fact-icon-wrap { color: var(--brand); }
  .fact-card.indigo .fact-icon-wrap { color: var(--indigo); }
  .fact-card.amber .fact-icon-wrap { color: var(--amber); }
  .fact-card.teal .fact-icon-wrap { color: var(--teal); }
  .fact-icon-wrap svg { width: 16px; height: 16px; }

  .fact-pill {
    font-size: 10.5px;
    font-weight: 900;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .fact-card.emerald .fact-pill { background: #d1fae5; color: #065f46; }
  .fact-card.indigo .fact-pill { background: #e0e7ff; color: #3730a3; }
  .fact-card.amber .fact-pill { background: #fef3c7; color: #92400e; }
  .fact-card.teal .fact-pill { background: #ccfbf1; color: #115e59; }

  .fact-label { font-size: 12px; font-weight: 700; color: var(--text-3); margin: 0; }
  .fact-num { font-size: 30px; font-weight: 950; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: #0f172a; margin: 4px 0 0; }
  .fact-num span { font-size: 13px; font-weight: 700; color: var(--text-4); margin-left: 2px; }
  .fact-sub { font-size: 11.5px; font-weight: 600; color: var(--text-4); margin: 4px 0 0; }

  /* 图表卡片 */
  .chart-box {
    position: relative;
    width: 100%;
    margin-top: 14px;
  }
  svg.chart {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }
  svg text.axis { fill: var(--text-4); font-size: 11px; font-weight: 600; font-family: inherit; }
  svg line.grid { stroke: #f1f5f9; stroke-width: 1; }
  svg line.zero { stroke: #cbd5e1; stroke-width: 1; }
  svg line.ref { stroke: #94a3b8; stroke-dasharray: 4 4; stroke-width: 1.5; }
  svg rect.bar-hit { fill: transparent; cursor: pointer; }
  svg rect.bar-hit:hover { fill: rgba(15, 23, 42, 0.04); }

  /* 图例 */
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 4px 0 12px; font-size: 12px; font-weight: 700; color: var(--text-3); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }
  .legend i.ln { width: 16px; height: 0; border-radius: 0; border-top: 2.5px solid #0f172a; }
  .legend i.ln.bal { border-top-color: #2563eb; }

  /* 金额构成清单 */
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: baseline; font-size: 13px; }
  .kv .k { color: var(--text-2); font-weight: 600; }
  .kv .v { text-align: right; color: var(--text); font-weight: 800; font-variant-numeric: tabular-nums; }

const fmt = (n) => (isFinite(n) ? Math.round(n).toLocaleString("zh-CN") : "—");
const floor100 = (x) => Math.floor(x / 100) * 100;
const wan = (v) => {
  if (!isFinite(v)) return "—";
  const x = Math.abs(v / 1e4);
  const n = x < 10 ? Math.round(x * 10) / 10 : Math.round(x);
  return (v < 0 && n > 0 ? "−" : "") + n + " 万";
};
// "210 万" → <b>210</b><span>万</span>；没有单位的文案整体加粗
const moneyHtml = (v) => {
  const m = /^(.+?)\s(\S+)$/.exec(v);
  return m ? `<b>${m[1]}</b><span>${m[2]}</span>` : `<b class="text">${v}</b>`;
};
const signedWan = (v) => (!isFinite(v) ? "—" : (v >= 0 ? "+" : "−") + wan(Math.abs(v)));
const w1 = (v) => (isFinite(v) ? (Math.round(v / 1000) / 10).toFixed(1) : "—");
const ceilText = (c) => (isFinite(c) && floor100(c) >= 1000 ? `${fmt(floor100(c))} 元` : "怎么省都不够");

const clone = (o) => JSON.parse(JSON.stringify(o));
const getPath = (o, p) => p.split(".").reduce((x, k) => (x == null ? undefined : x[k]), o);
const setPath = (o, p, v) => {
  const ks = p.split(".");
  const last = ks.pop();
  ks.reduce((x, k) => x[k], o)[last] = v;
};

// 以下计算模型与桌面端 pc/src/pages/retirement/model.ts 逐行一致，修改时两端必须同步
const STAGES = ["0–2 岁", "3–5 岁（幼儿园）", "6–11 岁（小学）", "12–14 岁（初中）", "15–17 岁（高中）", "18–21 岁（大学）"];
const STAGE_NAMES = ["婴幼儿", "幼儿园", "小学", "初中", "高中", "大学"];

const calcMonths = (age) => CALC_MONTHS[Math.max(40, Math.min(70, Math.round(age)))];
const stageIdx = (c) => (c <= 2 ? 0 : c <= 5 ? 1 : c <= 11 ? 2 : c <= 14 ? 3 : c <= 17 ? 4 : 5);

function statutory(birthIdx, gender) {
  const g = GENDERS[gender] || GENDERS.male;
  const n = birthIdx - g.start;
  const delay = n < 0 ? 0 : Math.min(g.max, Math.floor(n / g.per) + 1);
  const ageM = g.base * 12 + delay;
  return { ageM, date: birthIdx + ageM, delay, base: g.base };
}

function minYearsAt(dateIdx) {
  const y = Math.floor(dateIdx / 12);
  return y < 2030 ? 15 : Math.min(20, 15 + 0.5 * (y - 2029));
}

function factorAt(bands, a) {
  let f = 1;
  for (const [s, e, v] of bands) if (a >= s && a < e) f = v;
  return f;
}

function pensionMonthly(base, index, years, claimAge) {
  const basic = ((base * (1 + index)) / 2) * years / 100;
  const account = base * index * 0.08 * 12 * years;
  return basic + account / calcMonths(claimAge);
}

const OUTLOOK_GROWTH = { stable: () => 0, up: (s) => s.upRate, down: (s) => -s.downRate, unstable: () => 0 };

function toParams(s, now = NOW) {
  const sp = !!s.hasSpouse;
  const b1 = ym(s.me.birth);
  const b2 = sp ? ym(s.spouse.birth) : NaN;
  const st1 = statutory(b1, s.me.gender);
  const st2 = sp ? statutory(b2, s.spouse.gender) : null;
  const P1 = st1.date - now;
  const P2 = st2 ? st2.date - now : Infinity;
  const T1 = ym(s.stopMe) - now;
  const T2 = sp ? (s.together ? T1 : ym(s.stopSpouse) - now) : 0;
  const covered = s.afterPension === "covered";
  const lastP = sp ? Math.max(P1, P2) : P1;
  return {
    now, sp, b1, b2, st1, st2, P1, P2, T1, T2, together: !!s.together, covered, lastP,
    endAge: s.endAge,
    E: covered ? lastP : b1 + s.endAge * 12 - now,
    inc1: s.inc1,
    inc2: sp ? s.inc2 : 0,
    bonus1: (s.bonus1 * 1e4) / 12,
    bonus2: sp ? (s.bonus2 * 1e4) / 12 : 0,
    g: (OUTLOOK_GROWTH[s.outlook] || OUTLOOK_GROWTH.stable)(s) / 100,
    cut1: s.outlook === "unstable" ? b1 + s.cutAge * 12 - now : Infinity,
    cut2: sp && s.outlook === "unstable" ? b2 + s.cutAge * 12 - now : Infinity,
    cutF: s.cutPct / 100,
    assets: s.assets * 1e4,
    r: s.ret / 100,
    infl: s.infl / 100,
    floor: s.floor * 1e4,
    livingWork: s.livingWork,
    rent: s.hasRent ? s.rent : 0,
    livingBridge: s.livingBridge,
    livingPension: s.livingPension,
    mort: s.hasMortgage ? s.mortMonthly : 0,
    mortEnd: s.hasMortgage ? ym(s.mortEnd) - now : -1,
    hf: s.hasMortgage ? s.hfOffset : 0,
    debts: s.debts.map((d) => ({ name: d.name, monthly: +d.monthly || 0, end: ym(d.end) - now })),
    children: s.hasKids ? s.children.map((c) => ({ born: !!c.born, b: ym(c.date) - now })) : [],
    stage: s.stage.slice(),
    birthCost: s.birthCost * 1e4,
    edu: s.eduGrowth / 100,
    childTax: s.childTax,
    mode: s.pensionMode,
    pension1: s.pension1,
    pension2: sp ? s.pension2 : 0,
    base: s.calcBase,
    years1: s.years1,
    idx1: s.index1,
    years2: sp ? s.years2 : 0,
    idx2: s.index2,
    siAfter: s.siAfter,
    flex: s.flexPension,
    med: s.med,
    oneOffs: s.oneOffs.map((o) => ({
      name: o.name,
      t: ym(o.date) - now,
      amount: (+o.amount || 0) * 1e4,
      every: Math.max(0, Math.round(+o.every || 0)),
    })),
    incomes: s.incomes.map((o) => ({ name: o.name, amount: +o.monthly || 0, from: o.from, to: o.to })),
    shock1: [],
    shock2: [],
  };
}

const ageYears = (p, t, b) => Math.floor((p.now + t - b) / 12);

function kidCost(s, c, now) {
  const b = ym(c.date);
  if (!isFinite(b) || (!c.born && b < now)) return 0;
  const edu = s.eduGrowth / 100;
  let total = c.born ? 0 : s.birthCost * 1e4;
  for (let t = Math.max(0, b - now); t - (b - now) < CHILD_MONTHS; t++) {
    const age = t - (b - now);
    total += (+s.stage[stageIdx(Math.floor(age / 12))] || 0) * Math.pow(1 + edu, t / 12);
  }
  return total;
}

function oneOffAt(o, t) {
  if (o.every > 0) {
    const k = t - o.t;
    return k >= 0 && k % (o.every * 12) === 0;
  }
  return t === o.t;
}

function simulate(p) {
  const E = Math.max(0, p.E);
  const emp1 = new Float64Array(E);
  const emp2 = new Float64Array(E);
  let m1 = p.years1 * 12;
  let m2 = p.years2 * 12;
  for (let t = 0; t < E; t++) {
    const f1 = t < p.T1 ? factorAt(p.shock1, ageYears(p, t, p.b1)) : 0;
    const f2 = p.sp && t < p.T2 ? factorAt(p.shock2, ageYears(p, t, p.b2)) : 0;
    emp1[t] = f1;
    emp2[t] = f2;
    if (f1 > 0 && t < p.P1) m1++;
    if (f2 > 0 && t < p.P2) m2++;
  }
  const minY1 = minYearsAt(p.st1.date);
  const minY2 = p.st2 ? minYearsAt(p.st2.date) : 0;
  const selfPay = (emp, P, months, minY, active) => {
    const pay = new Float64Array(E);
    let m = months;
    if (!active) return { pay, m };
    for (let t = 0; t < Math.min(E, P); t++) {
      if (emp[t] > 0) continue;
      if (p.siAfter === "continue" || (p.mode === "formula" && m < minY * 12)) {
        pay[t] = p.flex;
        m++;
      }
    }
    return { pay, m };
  };
  const s1 = selfPay(emp1, p.P1, m1, minY1, true);
  const s2 = selfPay(emp2, p.P2, m2, minY2, p.sp);
  const pen1 = p.mode === "formula" ? pensionMonthly(p.base, p.idx1, s1.m / 12, Math.floor(p.st1.ageM / 12)) : p.pension1;
  const pen2 = !p.st2
    ? 0
    : p.mode === "formula"
      ? pensionMonthly(p.base, p.idx2, s2.m / 12, Math.floor(p.st2.ageM / 12))
      : p.pension2;

  const baseInc = p.inc1 + p.inc2;
  const rows = [];
  for (let t = 0; t < E; t++) {
    const f1 = emp1[t] * (t >= p.cut1 ? p.cutF : 1);
    const f2 = emp2[t] * (t >= p.cut2 ? p.cutF : 1);
    const grow = Math.pow(1 + p.g, t / 12);
    const share = baseInc > 0 ? (p.inc1 * f1 + p.inc2 * f2) / baseInc : 0;
    const salary = (p.inc1 * f1 + p.inc2 * f2) * grow;
    const bonus = (p.bonus1 * f1 + p.bonus2 * f2) * grow;
    const up = Math.pow(1 + p.infl, t / 12);
    const mortOn = t <= p.mortEnd;
    const hf = mortOn ? p.hf * share : 0;
    const mort = mortOn ? p.mort : 0;
    let debt = 0;
    for (const d of p.debts) if (t <= d.end) debt += d.monthly;
    const working = t < p.T1;
    const living = (working ? 0 : !p.covered && t >= p.lastP ? p.livingPension : p.livingBridge) * up;
    const rent = working ? p.rent : 0;
    const anyWork = f1 > 0 || f2 > 0;
    let child = 0;
    let childBirth = 0;
    for (const c of p.children) {
      const age = t - c.b;
      if (!c.born && age === 0) childBirth += p.birthCost;
      if (age >= 0 && age < CHILD_MONTHS) {
        child += Math.max(0, p.stage[stageIdx(Math.floor(age / 12))] * Math.pow(1 + p.edu, t / 12) - (anyWork ? p.childTax : 0));
      }
    }
    child += childBirth;
    const med = (f1 === 0 && t < p.P1 ? p.med : 0) + (p.sp && f2 === 0 && t < p.P2 ? p.med : 0);
    const si = s1.pay[t] + s2.pay[t];
    const pension = (t >= p.P1 ? pen1 : 0) + (p.sp && t >= p.P2 ? pen2 : 0);
    const y1 = ageYears(p, t, p.b1);
    let other = 0;
    for (const o of p.incomes) if (y1 >= o.from && y1 <= o.to) other += o.amount;
    let one = 0;
    for (const o of p.oneOffs) if (oneOffAt(o, t)) one += o.amount;
    const net = salary + bonus + hf + pension + other - living - rent - mort - debt - child - med - si - one;
    rows.push({ t, up, working, f1, f2, salary, bonus, hf, pension, other, living, rent, mort, debt, child, childBirth, med, si, one, net });
  }
  return { rows, m1: s1.m, m2: s2.m, pen1, pen2, minY1, minY2 };
}

function analyze(p) {
  const sim = simulate(p);
  const rows = sim.rows;
  const E = rows.length;
  const T = Math.max(0, Math.min(E, p.T1));
  const rm = Math.pow(1 + p.r, 1 / 12) - 1;
  let A = p.assets;
  let FV = 0;
  for (let t = 0; t < T; t++) {
    A = A * (1 + rm) + rows[t].net;
    FV = FV * (1 + rm) + rows[t].up;
  }
  let C = 0;
  let disc = 1;
  let need = p.floor;
  for (let t = T; t < E; t++) {
    C = C * (1 + rm) + rows[t].net;
    disc *= 1 + rm;
    need = Math.max(need, (p.floor - C) / disc);
  }
  const have = A - p.livingWork * FV;
  return { T, E, rm, need, have, gap: have - need, ceiling: FV > 0 ? (A - need) / FV : NaN, P0: A, FV, rows, sim };
}

function assetPath(p, a, living) {
  let A = p.assets;
  const out = [A];
  for (const row of a.rows) {
    A = A * (1 + a.rm) + row.net - (row.working ? living * row.up : 0);
    out.push(A);
  }
  return out;
}

function withStop(p, T) {
  return { ...p, T1: T, T2: p.sp ? (p.together ? T : p.T2) : 0 };
}

function earliest(p) {
  const maxT = Math.min(p.E, p.b1 + 75 * 12 - p.now);
  if (maxT < 1) return null;
  const ok = (T) => analyze(withStop(p, T)).gap >= 0;
  let prev = 0;
  for (let T = 1; ; T += 12) {
    const c = Math.min(T, maxT);
    if (ok(c)) {
      for (let x = prev + 1; x < c; x++) if (ok(x)) return x;
      return c;
    }
    if (c >= maxT) return null;
    prev = c;
  }
}

function riskAges(p) {
  const cur = ageYears(p, 0, p.b1);
  const R = ageYears(p, p.T1, p.b1);
  const a5 = Math.max(cur + 1, R - 5);
  const a10 = Math.max(cur + 1, R - 10);
  const diff = p.sp ? ageYears(p, 0, p.b2) - cur : 0;
  return { cur, R, a5, a10, s5: a5 + diff, s10: a10 + diff };
}

function scenarioList(p) {
  const { cur, R, a5, a10, s5, s10 } = riskAges(p);
  const list = [{ id: "base", name: "当前设定", job: true, p }];
  const job = (id, name, h, w) => list.push({ id, name, job: true, p: { ...p, shock1: h, shock2: p.sp ? w : [] } });
  if (R - cur >= 2) {
    job("h10cut30", `你 ${a10} 岁起降薪 30%`, [[a10, 999, 0.7]], []);
    job("h5gap1half", `你 ${a5} 岁失业 1 年，之后收入减半`, [[a5, a5 + 1, 0], [a5 + 1, 999, 0.5]], []);
    job("h5out", `你 ${a5} 岁后再也找不到工作`, [[a5, 999, 0]], []);
    if (a10 < a5) job("h10out", `你 ${a10} 岁后再也找不到工作`, [[a10, 999, 0]], []);
    if (p.sp) {
      job("w10gap1cut30", `伴侣 ${s10} 岁失业 1 年，之后降薪 30%`, [], [[s10, s10 + 1, 0], [s10 + 1, 999, 0.7]]);
      job("both5cut30", `两人从你 ${a5} 岁起都降薪 30%`, [[a5, 999, 0.7]], [[s5, 999, 0.7]]);
    }
  }
  list.push({ id: "r-1", name: "投资收益每年少 1 个百分点", job: false, p: { ...p, r: p.r - 0.01 } });
  list.push({
    id: "spend+1000",
    name: "提前退休后每月多花 1,000",
    job: false,
    p: { ...p, livingBridge: p.livingBridge + 1000, livingPension: p.livingPension + 1000 },
  });
  if (p.covered) {
    list.push({
      id: "pension+2",
      name: "领养老金再推迟 2 年",
      job: false,
      p: { ...p, P1: p.P1 + 24, P2: p.sp ? p.P2 + 24 : p.P2, lastP: p.lastP + 24, E: p.E + 24 },
    });
  } else {
    list.push({ id: "live+5", name: `多活 5 年（存款撑到 ${p.endAge + 5} 岁）`, job: false, p: { ...p, E: p.E + 60 } });
  }
  list.push({ id: "later1", name: `晚 1 年退休（${fmtYM(p.now + p.T1 + 12)}）`, job: false, p: withStop(p, p.T1 + 12) });
  if (p.T1 - 12 >= 1) {
    list.push({ id: "earlier1", name: `早 1 年退休（${fmtYM(p.now + p.T1 - 12)}）`, job: false, p: withStop(p, p.T1 - 12) });
  }
  return list;
}

const birthOf = (s, key) => ym(s[key].birth);
const statOf = (s, key) => {
  const b = birthOf(s, key);
  return isFinite(b) ? statutory(b, s[key].gender) : null;
};

const lastPensionDate = (s) => {
  const a = statOf(s, "me");
  const b = s.hasSpouse ? statOf(s, "spouse") : null;
  if (!a || (s.hasSpouse && !b)) return NaN;
  return b ? Math.max(a.date, b.date) : a.date;
};

const newChild = () => ({ born: false, date: ymStr(NOW + 12) });

function validate(s) {
  const errs = [];
  const sp = s.hasSpouse;
  const b1 = ym(s.me.birth);
  const b2 = sp ? ym(s.spouse.birth) : NaN;
  const ageOk = (b) => isFinite(b) && NOW - b >= 16 * 12 && NOW - b <= 80 * 12;
  if (!ageOk(b1)) errs.push("你的出生日期要让年龄在 16 到 80 岁之间。");
  if (sp && !ageOk(b2)) errs.push("伴侣的出生日期要让年龄在 16 到 80 岁之间。");
  if (errs.length) return errs;
  const st1 = statutory(b1, s.me.gender);
  const st2 = sp ? statutory(b2, s.spouse.gender) : null;
  const s1 = ym(s.stopMe);
  if (!(s1 > NOW)) errs.push("计划提前退休的时间要晚于这个月。");
  else if (s1 > st1.date) errs.push(`计划提前退休的时间不能晚于你的法定退休时间（${fmtYM(st1.date)}）。`);
  else if (s.afterPension === "covered") {
    const lp = st2 ? Math.max(st1.date, st2.date) : st1.date;
    if (s1 >= lp) errs.push(`计划提前退休的时间要早于${sp ? "两人都开始领养老金" : "开始领养老金"}的时间（${fmtYM(lp)}）。`);
  } else {
    if (!Number.isInteger(s.endAge) || b1 + s.endAge * 12 <= s1) errs.push("“存款要撑到你几岁”要大于提前退休时的年龄。");
    else if (b1 + s.endAge * 12 - NOW > 90 * 12) errs.push("规划时间太长了，请把“存款要撑到你几岁”改小一点。");
  }
  if (st2 && !s.together) {
    const s2 = ym(s.stopSpouse);
    if (!isFinite(s2)) errs.push("请选择伴侣提前退休的时间。");
    else if (s2 > st2.date) errs.push(`伴侣提前退休的时间不能晚于伴侣的法定退休时间（${fmtYM(st2.date)}）。`);
  }
  if (s.hasMortgage && !isFinite(ym(s.mortEnd))) errs.push("请选择房贷最后一期的时间。");
  if (s.hasKids) {
    s.children.forEach((c, i) => {
      const b = ym(c.date);
      if (!isFinite(b)) errs.push(`请填写孩子 ${i + 1} 的${c.born ? "出生日期" : "计划出生时间"}。`);
      else if (c.born && b > NOW) errs.push(`孩子 ${i + 1} 的出生日期不能晚于今天。`);
      else if (!c.born && b < NOW) errs.push(`孩子 ${i + 1} 的计划出生时间要晚于现在；已经出生的请选“已出生”。`);
    });
  }
  if (s.ret <= -50 || s.ret > 30) errs.push("投资收益请填 −50% 到 30% 之间的数。");
  if (s.hasRent && !(s.rent >= 0)) errs.push("每月房租不能小于 0。");
  if (s.outlook === "up" && !(s.upRate >= 0 && s.upRate <= 30)) errs.push("收入每年上涨请填 0% 到 30% 之间的数。");
  if (s.outlook === "down" && !(s.downRate >= 0 && s.downRate <= 50)) errs.push("收入每年下降请填 0% 到 50% 之间的数。");
  if (s.outlook === "unstable" && !(s.cutAge >= 18 && s.cutAge <= 70)) errs.push("收入减少的年龄请填 18 到 70 岁之间。");
  if (s.outlook === "unstable" && !(s.cutPct >= 0 && s.cutPct <= 100)) errs.push("收入变成原来的比例请填 0% 到 100% 之间的数。");
  if (s.stage.some((x) => x < 0)) errs.push("孩子的花费不能是负数。");
  return errs;
}

function syncStops(s) {
  const b1 = ym(s.me.birth);
  const b2 = ym(s.spouse.birth);
  if (isFinite(b1)) s.stopMe = ymStr(b1 + s.stopAgeMe * 12);
  if (isFinite(b2)) s.stopSpouse = ymStr(b2 + s.stopAgeSpouse * 12);
}

const isObj = (x) => !!x && typeof x === "object" && !Array.isArray(x);
const str = (x) => (typeof x === "string" ? x : "");
const numOr = (x, d) => (isNum(x) ? x : d);
const LIST_NORMALIZERS = {
  debts: (x) => ({ name: str(x.name), monthly: numOr(x.monthly, 0), end: str(x.end) }),
  children: (x) => ({ born: !!x.born, date: str(x.date) }),
  oneOffs: (x) => ({ name: str(x.name), date: str(x.date), amount: numOr(x.amount, 0), every: numOr(x.every, 0) }),
  incomes: (x) => ({ name: str(x.name), monthly: numOr(x.monthly, 0), from: numOr(x.from, 0), to: numOr(x.to, 0) }),
};

function sanitize(raw) {
  const s = clone(DEFAULTS);
  if (!isObj(raw)) return s;
  for (const k of Object.keys(s)) {
    const d = s[k];
    const v = raw[k];
    if (v === undefined) continue;
    if (Array.isArray(d)) {
      if (!Array.isArray(v)) continue;
      if (k === "stage") s[k] = d.map((x, i) => (isNum(v[i]) ? v[i] : x));
      else s[k] = v.filter(isObj).map(LIST_NORMALIZERS[k] || ((x) => x));
    } else if (isObj(d)) {
      if (isObj(v)) s[k] = { ...d, ...v };
    } else if (typeof d === typeof v) {
      s[k] = v;
    }
  }
  for (const key of ["me", "spouse"]) {
    s[key].birth = str(s[key].birth);
    if (s[key].gender !== "male") s[key].gender = "female55";
  }
  if (raw.rates !== "nominal") {
    for (const k of ["ret", "eduGrowth"]) {
      const v = raw[k];
      if (isNum(v)) s[k] = Math.round(((1 + v / 100) * (1 + s.infl / 100) - 1) * 1000) / 10;
    }
  }
  s.rates = "nominal";
  const stopPairs = [
    ["stopAgeMe", "stopMe", "me"],
    ["stopAgeSpouse", "stopSpouse", "spouse"],
  ];
  for (const [ageKey, dateKey, who] of stopPairs) {
    const b = ym(s[who].birth);
    const d = ym(str(raw[dateKey]));
    if (!isNum(raw[ageKey]) && isFinite(b) && isFinite(d)) s[ageKey] = Math.round((d - b) / 12);
  }
  if (isNum(s.floor) && s.floor >= 1000) s.floor = Math.round(s.floor / 1e4);
  syncStops(s);
  return s;
}

// ==================== 2. SVG 图表绘制 ====================
function niceStep(range, ticks = 6) {
  const raw = range / ticks || 1;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
}
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function label(parent, x, y, text, attrs) {
  const t = el("text", { x, y, ...attrs }, parent);
  t.textContent = text;
  return t;
}
function makeTip(box) {
  let tip = box.querySelector(".tip");
  if (!tip) {
    tip = document.createElement("div");
    tip.className = "tip";
    box.appendChild(tip);
  }
  return {
    show(html, evt) {
      tip.innerHTML = html;
      tip.style.display = "block";
      const r = box.getBoundingClientRect();
      let x = evt.clientX - r.left + 14;
      if (x + tip.offsetWidth > r.width) x = evt.clientX - r.left - tip.offsetWidth - 14;
      tip.style.left = Math.max(0, x) + "px";
      tip.style.top = evt.clientY - r.top + 14 + "px";
    },
    hide() { tip.style.display = "none"; },
  };
}
const tipRow = (color, name, value) =>
  `<div class="row"><span>${color ? `<i style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:${color}"></i>` : ""}${name}</span><span>${value}</span></div>`;

function yScale(values, H, m, minZero = true) {
  let lo = Math.min(...values), hi = Math.max(...values);
  if (minZero) lo = Math.min(0, lo);
  hi = Math.max(hi, lo + 1);
  const step = niceStep(hi - lo);
  lo = Math.floor(lo / step) * step;
  hi = Math.ceil((hi * 1.04) / step) * step;
  const Y = (v) => H - m.b - ((v - lo) / (hi - lo)) * (H - m.t - m.b);
  return { lo, hi, step, Y };
}
function yGrid(svg, sc, W, m, fmtV) {
  for (let v = sc.lo; v <= sc.hi + 1e-9; v += sc.step) {
    el("line", { x1: m.l, x2: W - m.r, y1: sc.Y(v), y2: sc.Y(v), class: Math.abs(v) < 1e-9 ? "zero" : "grid" }, svg);
    label(svg, m.l - 8, sc.Y(v) + 4, fmtV(v), { class: "axis", "text-anchor": "end" });
  }
}

function groupedBars(box, { cats, series, ref }) {
  box.innerHTML = "";
  const W = 960, H = 280, m = { l: 60, r: 16, t: 16, b: 34 };
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart" }, box);
  const vals = series.flatMap((s) => s.values).concat(ref ? [ref.value] : []);
  const sc = yScale(vals, H, m);
  yGrid(svg, sc, W, m, (v) => fmt(v));
  const gw = (W - m.l - m.r) / cats.length;
  const bw = Math.min(32, (gw * 0.7) / series.length);
  const tip = makeTip(box);
  cats.forEach((c, i) => {
    const gx = m.l + i * gw;
    const hitRect = el("rect", { x: gx, y: m.t, width: gw, height: H - m.t - m.b, class: "bar-hit" }, svg);
    series.forEach((s, k) => {
      const v = Math.max(0, s.values[i]);
      const x = gx + gw / 2 - (bw * series.length) / 2 + k * bw + 1;
      el("rect", { x, y: sc.Y(v), width: bw - 2, height: Math.max(0, sc.Y(0) - sc.Y(v)), rx: 6, fill: s.color, "pointer-events": "none" }, svg);
    });
    label(svg, gx + gw / 2, H - m.b + 20, c.label, { class: "axis", "text-anchor": "middle" });
    hitRect.addEventListener("mousemove", (evt) =>
      tip.show(`<b>${c.title}</b>` + series.map((s) => tipRow(s.color, s.name, ceilText(s.values[i]))).join(""), evt));
    hitRect.addEventListener("mouseleave", () => tip.hide());
  });
  if (ref) el("line", { x1: m.l, x2: W - m.r, y1: sc.Y(ref.value), y2: sc.Y(ref.value), class: "ref", "pointer-events": "none" }, svg);
}

function stackedBars(box, { cats, segs, line, parts = [], balance, xStep, titles, save }) {
  box.innerHTML = "";
  const W = 960, H = 300, m = { l: 60, r: balance ? 64 : 16, t: 16, b: 34 };
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart" }, box);
  const totals = cats.map((_, i) => segs.reduce((s, g) => s + Math.max(0, g.values[i]), 0));
  const sc = yScale(totals.concat(line.values), H, m);
  yGrid(svg, sc, W, m, (v) => `${+v.toFixed(1)} 万`);
  const sb = balance ? yScale(balance.values, H, m) : null;
  if (sb) {
    for (let v = sb.lo; v <= sb.hi + 1e-9; v += sb.step) label(svg, W - m.r + 8, sb.Y(v) + 4, `${Math.round(v)} 万`, { class: "axis", "text-anchor": "start", fill: balance.color });
  }
  const gw = (W - m.l - m.r) / cats.length;
  const bw = Math.max(3, gw * 0.64);
  const bPts = [];
  const tip = makeTip(box);
  const pts = [];
  cats.forEach((c, i) => {
    const gx = m.l + i * gw;
    const hitRect = el("rect", { x: gx, y: m.t, width: gw, height: H - m.t - m.b, class: "bar-hit" }, svg);
    let acc = 0;
    for (const g of segs) {
      const v = Math.max(0, g.values[i]);
      if (v <= 0) continue;
      el("rect", { x: gx + (gw - bw) / 2, y: sc.Y(acc + v), width: bw, height: Math.max(0, sc.Y(acc) - sc.Y(acc + v)), rx: 3, fill: g.color, "pointer-events": "none" }, svg);
      acc += v;
    }
    pts.push([gx + gw / 2, sc.Y(line.values[i])]);
    if (sb) bPts.push([gx + gw / 2, sb.Y(balance.values[i])]);
    if ((c - cats[0]) % xStep === 0) label(svg, gx + gw / 2, H - m.b + 20, c, { class: "axis", "text-anchor": "middle" });
    hitRect.addEventListener("mousemove", (evt) =>
      tip.show(
        `<b>${titles[i]}</b>` +
          segs.map((g) => (g.values[i] > 0.005 ? tipRow(g.color, g.name, `${g.values[i].toFixed(1)} 万`) : "")).join("") +
          tipRow("", "支出合计", `${totals[i].toFixed(1)} 万`) +
          parts.map((g) => tipRow("", g.name, `${g.values[i].toFixed(1)} 万`)).join("") +
          tipRow(line.color, line.name, `${line.values[i].toFixed(1)} 万`) +
          (save
            ? tipRow("", "<b>当年存款增加</b>", `<b>${(line.values[i] - totals[i]).toFixed(1)} 万</b>`)
            : tipRow("", "<b>要从存款里拿</b>", `<b>${(totals[i] - line.values[i]).toFixed(1)} 万</b>`)) +
          (balance ? tipRow(balance.color, balance.name, `${balance.values[i].toFixed(1)} 万`) : ""),
        evt
      ));
    hitRect.addEventListener("mouseleave", () => tip.hide());
  });
  el("path", { d: pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join(""), stroke: line.color, "stroke-width": 2.5, fill: "none", "pointer-events": "none" }, svg);
  if (sb) {
    el("path", { d: bPts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join(""), stroke: balance.color, "stroke-width": 2.5, fill: "none", "pointer-events": "none" }, svg);
    for (const [x, y] of bPts) el("circle", { cx: x, cy: y, r: 3, fill: "#fff", stroke: balance.color, "stroke-width": 1.5, "pointer-events": "none" }, svg);
  }
}

// 倒计时刷新器
function updateCountdown(targetDate, birthMonthIdx) {
  const now = new Date();
  const diffSec = Math.max(0, Math.floor((targetDate.getTime() - now.getTime()) / 1000));
  const days = Math.floor(diffSec / 86400);

  const daysText = document.getElementById("cd-days-text");
  if (daysText) daysText.textContent = fmt(days);

  // 年月日时分秒拆解
  let cur = new Date(now.getTime());
  let years = targetDate.getFullYear() - cur.getFullYear();
  let temp = new Date(cur.getFullYear() + years, cur.getMonth(), cur.getDate(), cur.getHours(), cur.getMinutes(), cur.getSeconds());
  if (temp > targetDate) { years--; }
  cur.setFullYear(cur.getFullYear() + years);

  let months = (targetDate.getFullYear() - cur.getFullYear()) * 12 + (targetDate.getMonth() - cur.getMonth());
  if (targetDate.getDate() < cur.getDate()) months--;
  months = Math.max(0, months);
  cur.setMonth(cur.getMonth() + months);

  let restD = Math.max(0, Math.floor((targetDate.getTime() - cur.getTime()) / 86400000));
  const remSec = diffSec % 86400;
  const h = Math.floor(remSec / 3600);
  const m = Math.floor((remSec % 3600) / 60);
  const s = remSec % 60;

  const pad = (n) => String(n).padStart(2, "0");
  const elY = document.getElementById("cd-y");
  const elM = document.getElementById("cd-m");
  const elD = document.getElementById("cd-d");
  const elH = document.getElementById("cd-h");
  const elMin = document.getElementById("cd-min");
  const elS = document.getElementById("cd-s");

  if (elY) elY.textContent = years;
  if (elM) elM.textContent = months;
  if (elD) elD.textContent = restD;
  if (elH) elH.textContent = pad(h);
  if (elMin) elMin.textContent = pad(m);
  if (elS) elS.textContent = pad(s);

  // 进度条以提前退休时间为 100% 终点
  const birthDate = new Date(Math.floor(birthMonthIdx / 12), birthMonthIdx % 12, 1);
  const totalMs = targetDate.getTime() - birthDate.getTime();
  const passedMs = now.getTime() - birthDate.getTime();
  const pct = totalMs > 0 ? Math.min(100, Math.max(0, (passedMs / totalMs) * 100)) : 100;

  const bar = document.getElementById("life-progress-bar");
  const pctText = document.getElementById("life-progress-pct");
  if (bar) bar.style.width = `${pct}%`;
  if (pctText) pctText.textContent = `${pct.toFixed(2)}%`;
}

function drawCharts(p, a, plan, jobAges, lossHalf, lossPerm) {
  const ageAt = (t) => Math.floor((NOW + t - p.b1) / 12);
  const jobBox = document.getElementById("chart-job");
  if (jobBox) {
    groupedBars(jobBox, {
      cats: jobAges.map((x) => ({ label: `${x} 岁`, title: `你 ${x} 岁失业` })),
      series: [
        { name: "1 年后收入减半", color: "#059669", values: lossHalf.map((v) => (isFinite(v) ? floor100(v) : 0)) },
        { name: "再也找不到工作", color: "#f59e0b", values: lossPerm.map((v) => (isFinite(v) ? floor100(v) : 0)) },
      ],
      ref: { value: S.livingWork },
    });
  }

  // 每 12 个月一根柱子，最后一段截到 to；与桌面端 report.ts 的 cashBars 一致
  const cashChart = (id, from, to, opts) => {
    const starts = [];
    for (let s = from; s < to; s += 12) starts.push(s);
    const blk = (f) => starts.map((s) => a.rows.slice(s, Math.min(s + 12, to)).reduce((x, r) => x + f(r), 0) / 1e4);
    const cats = starts.map(ageAt);
    stackedBars(document.getElementById(id), {
      cats,
      titles: starts.map((s, i) => `你 ${cats[i]} 岁（${shortYM(NOW + s)}–${shortYM(NOW + Math.min(s + 12, to) - 1)}）`),
      segs: [
        { name: "日常开支", color: "#059669", values: blk((r) => (r.working ? p.livingWork * r.up : r.living)) },
        { name: "孩子", color: "#f59e0b", values: blk((r) => r.child) },
        { name: opts.houseName, color: "#8b5cf6", values: blk((r) => r.rent + r.mort + r.debt) },
        { name: "社保医保", color: "#06b6d4", values: blk((r) => r.med + r.si) },
        { name: "大额支出", color: "#ec4899", values: blk((r) => r.one) },
      ],
      ...(() => {
        const work = blk((r) => r.pension + r.other + r.salary + r.bonus + r.hf);
        if (!opts.save) return { line: { name: "收入", color: "#0f172a", values: work } };
        // 每月理财收益 = 月初存款 × 月收益率
        const gain = blk((r) => plan[r.t] * a.rm);
        return {
          parts: [{ name: "工作收入", values: work }, { name: "理财收益", values: gain }],
          line: { name: "收入合计", color: "#0f172a", values: work.map((v, i) => v + gain[i]) },
        };
      })(),
      balance: { name: "年末存款", color: "#2563eb", values: starts.map((s) => plan[Math.min(s + 12, to)] / 1e4) },
      xStep: cats.length > 30 ? 5 : cats.length > 15 ? 2 : 1,
      save: opts.save,
    });
  };
  cashChart("chart-pre", 0, a.T, { houseName: p.rent > 0 ? "房租房贷负债" : "房贷负债", save: true });
  cashChart("chart-post", a.T, a.E, { houseName: "房贷和负债", save: false });
}

            <span class="f-hint">各省每年公布，在当地人社部门网站能查到（如 7831）。</span>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;">
            <div class="f-row">
              <span class="f-label" style="font-size:11px;">你已交养老保险</span>
              <div class="f-inp-wrap"><input type="number" step="1" value="${S.years1}" onchange="updateInput('years1', +this.value)"><span class="f-unit">年</span></div>
            </div>
            <div class="f-row">
              <span class="f-label" style="font-size:11px;">你的缴费指数</span>
              <div class="f-inp-wrap"><input type="number" step="0.1" value="${S.index1}" onchange="updateInput('index1', +this.value)"></div>
            </div>
          </div>

          ${S.hasSpouse ? `
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;">
              <div class="f-row">
                <span class="f-label" style="font-size:11px;">伴侣已交养老保险</span>
                <div class="f-inp-wrap"><input type="number" step="1" value="${S.years2}" onchange="updateInput('years2', +this.value)"><span class="f-unit">年</span></div>
              </div>
              <div class="f-row">
                <span class="f-label" style="font-size:11px;">伴侣缴费指数</span>
                <div class="f-inp-wrap"><input type="number" step="0.1" value="${S.index2}" onchange="updateInput('index2', +this.value)"></div>
              </div>
            </div>
          ` : ""}

          <span class="f-hint">缴费指数：按最低基数交是 0.6，按平均工资交是 1.0，换过工作取平均值。</span>

          ${st1 ? `
            <span class="f-hint" style="color:var(--brand); font-weight:700; margin-top:6px;">
              你 ${Math.floor(st1.date / 12)} 年起领，按政策最少要交 <b>${minYearsAt(st1.date)} 年</b>
              ${st2 ? `；伴侣 ${Math.floor(st2.date / 12)} 年起领，最少要交 <b>${minYearsAt(st2.date)} 年</b>` : ""}。不够的在提前退休后会自动补足交够。
            </span>
          ` : ""}
        ` : `
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;">
            <div class="f-row">
              <span class="f-label" style="font-size:11px;">你每月养老金</span>
              <div class="f-inp-wrap"><input type="number" step="100" value="${S.pension1}" onchange="updateInput('pension1', +this.value)"><span class="f-unit">元</span></div>
            </div>
            ${S.hasSpouse ? `
              <div class="f-row">
                <span class="f-label" style="font-size:11px;">伴侣每月养老金</span>
                <div class="f-inp-wrap"><input type="number" step="100" value="${S.pension2}" onchange="updateInput('pension2', +this.value)"><span class="f-unit">元</span></div>
              </div>
            ` : ""}
          </div>
        `}

        <div class="f-row" style="margin-top:12px;">
          <span class="f-label">提前退休后的养老保险缴纳方式</span>
          <div class="f-inp-wrap">
            <select onchange="updateInput('siAfter', this.value)">
              <option value="stop" ${S.siAfter === "stop" ? "selected" : ""}>停交（不够法定最低年限就补够）</option>
              <option value="continue" ${S.siAfter === "continue" ? "selected" : ""}>自己交到正式领养老金</option>
            </select>
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;">
          <div class="f-row">
            <span class="f-label" style="font-size:11px;">自交养老保险</span>
            <div class="f-inp-wrap"><input type="number" step="50" value="${S.flexPension}" onchange="updateInput('flexPension', +this.value)"><span class="f-unit">元/人/月</span></div>
          </div>
          <div class="f-row">
            <span class="f-label" style="font-size:11px;">自交医保费用</span>
            <div class="f-inp-wrap"><input type="number" step="50" value="${S.med}" onchange="updateInput('med', +this.value)"><span class="f-unit">元/人/月</span></div>
          </div>
        </div>
      </div>

      <div class="f-group">
        <h4 style="margin:0 0 4px; font-size:14px; font-weight:900;">其他被动与副业收入</h4>
        <span class="f-hint" style="margin-bottom:8px;">工资和养老金以外的确定性收入，比如租金、轻量副业等。</span>

        <div style="display:flex; flex-direction:column; gap:10px;">
          ${(S.incomes || []).map((o, idx) => `
            <div style="background:#ffffff; border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:8px;">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <input type="text" value="${o.name}" style="font-weight:900; font-size:13.5px; border:none; outline:none;" onchange="updateIncomeItem(${idx}, 'name', this.value)">
                <button type="button" class="dial-btn" onclick="removeIncome(${idx})">✕</button>
              </div>
              <div class="f-row">
                <span class="f-label" style="font-size:11px;">每月金额</span>
                <div class="f-inp-wrap"><input type="number" step="100" value="${o.monthly}" onchange="updateIncomeItem(${idx}, 'monthly', +this.value)"><span class="f-unit">元/月</span></div>
              </div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="f-row">
                  <span class="f-label" style="font-size:11px;">从你几岁开始</span>
                  <div class="f-inp-wrap"><input type="number" step="1" value="${o.from}" onchange="updateIncomeItem(${idx}, 'from', Math.round(+this.value))"><span class="f-unit">岁</span></div>
                </div>
                <div class="f-row">
                  <span class="f-label" style="font-size:11px;">到你几岁结束(含)</span>
                  <div class="f-inp-wrap"><input type="number" step="1" value="${o.to}" onchange="updateIncomeItem(${idx}, 'to', Math.round(+this.value))"><span class="f-unit">岁</span></div>
                </div>
              </div>
            </div>
          `).join("")}

          <button type="button" class="btn-pill secondary" onclick="addNewIncome()" style="justify-content:center;">+ 添加一项其他收入</button>
        </div>
      </div>
    `;
  }
}

// 统一数据变更同步并刷新界面
function applyStateChange(rerenderModal = true) {
  syncStops(S);
  save();
  renderHeaderPills();
  renderCompactDials();
  renderResults();
  if (rerenderModal) {
    renderModalNav();
    renderModalContent();
  }
}
window.applyStateChange = applyStateChange;

function updateSpouse(val) {
  S.hasSpouse = val;
  applyStateChange(true);
}
window.updateSpouse = updateSpouse;

function updateInput(path, val) {
  setPath(S, path, val);
  if (path === "hasMortgage" && S.hasMortgage && !(ym(S.mortEnd) >= NOW)) {
    S.mortEnd = ymStr(NOW + 239);
  }
  // 如果是结构性字段切换，需要立即重新渲染弹窗内容以展现或隐藏联动字段
  const structuralFields = [
    "hasMortgage", "hasRent", "hasKids", "hasSpouse", "together",
    "outlook", "pensionMode", "afterPension", "siAfter", "me.gender", "spouse.gender"
  ];
  const needRerender = structuralFields.includes(path) || path.includes("birth");
  applyStateChange(needRerender);
}
window.updateInput = updateInput;

function updateStopAge(who, val) {
  if (who === "me") {
    S.stopAgeMe = val;
    if (S.together && S.hasSpouse) {
      S.stopAgeSpouse = val;
    }
  } else {
    S.stopAgeSpouse = val;
  }
  applyStateChange(true);
}
window.updateStopAge = updateStopAge;

function updateKidsToggle(checked) {
  S.hasKids = checked;
  if (checked && (!S.children || !S.children.length)) {
    S.children = [newChild()];
  }
  applyStateChange(true);
}
window.updateKidsToggle = updateKidsToggle;

function setKidBorn(idx, born) {
  const c = S.children[idx];
  c.born = born;
  c.date = born ? todayStr : ymStr(NOW + 12);
  applyStateChange(true);
}
window.setKidBorn = setKidBorn;

function updateKidDate(idx, date) {
  S.children[idx].date = date;
  applyStateChange(true);
}
window.updateKidDate = updateKidDate;

function removeKid(idx) {
  S.children.splice(idx, 1);
  if (!S.children.length) S.hasKids = false;
  applyStateChange(true);
}
window.removeKid = removeKid;

function addNewKid() {
  if (!S.children) S.children = [];
  S.children.push(newChild());
  applyStateChange(true);
}
window.addNewKid = addNewKid;

function updateStageCost(idx, val) {
  S.stage[idx] = val;
  applyStateChange(false);
}
window.updateStageCost = updateStageCost;

function updateDebtItem(idx, key, val) {
  S.debts[idx][key] = val;
  applyStateChange(key === 'end');
}
window.updateDebtItem = updateDebtItem;

function removeDebt(idx) {
  S.debts.splice(idx, 1);
  applyStateChange(true);
}
window.removeDebt = removeDebt;

function addNewDebt() {
  if (!S.debts) S.debts = [];
  S.debts.push({ name: "车贷", monthly: 2000, end: ymStr(NOW + 35) });
  applyStateChange(true);
}
window.addNewDebt = addNewDebt;

function addOneOffByPreset(presetKey) {
  S.oneOffs.push(presetItem(S, presetKey));
  applyStateChange(true);
}
window.addOneOffByPreset = addOneOffByPreset;

function updateOneOffItem(idx, key, val) {
  S.oneOffs[idx][key] = val;
  applyStateChange(key === 'every' || key === 'date');
}
window.updateOneOffItem = updateOneOffItem;

function removeOneOff(idx) {
  S.oneOffs.splice(idx, 1);
  applyStateChange(true);
}
window.removeOneOff = removeOneOff;

function addOneOffPreset() {
  S.oneOffs.push({ name: "大额预算", date: ymStr(NOW + 60), amount: 10, every: 0 });
  applyStateChange(true);
}
window.addOneOffPreset = addOneOffPreset;

function addNewIncome() {
  if (!S.incomes) S.incomes = [];
  const a0 = stopAgeYears(S);
  S.incomes.push({ name: "其他收入", monthly: 1000, from: a0, to: a0 + 9 });
  applyStateChange(true);
}
window.addNewIncome = addNewIncome;

function updateIncomeItem(idx, key, val) {
  S.incomes[idx][key] = val;
  applyStateChange(false);
}
window.updateIncomeItem = updateIncomeItem;

function removeIncome(idx) {
  S.incomes.splice(idx, 1);
  applyStateChange(true);
}
window.removeIncome = removeIncome;

// 按钮监听绑定
document.getElementById("btn-open-modal").addEventListener("click", openFinanceModal);
document.getElementById("btn-profile-pill").addEventListener("click", openFinanceModal);
document.getElementById("btn-close-modal").addEventListener("click", closeFinanceModal);
document.getElementById("btn-modal-done").addEventListener("click", closeFinanceModal);

document.getElementById("btn-reset-data").addEventListener("click", () => {
  if (!confirm("确定把所有填写内容恢复成默认值吗？现在填的内容会被清掉。")) return;
  S = clone(DEFAULTS);
  save();
  renderModalContent();
  renderResults();
});

document.getElementById("btn-export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `退休规划数据-${todayStr}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

document.getElementById("btn-import").addEventListener("click", () => document.getElementById("file-import").click());
document.getElementById("file-import").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      S = sanitize(JSON.parse(reader.result));
      save();
      renderResults();
      alert("导入成功！已更新规划测算。");
    } catch (err) {
      alert("这个文件读不出来，请选择之前导出的 .json 文件。");
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});

document.getElementById("btn-image").addEventListener("click", () => {
  window.print();
});

// 初始化启动
renderResults();
</script>
</body>
</html>
