<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>退休规划</title>
<style>
  :root {
    --bg: #f8fafc;
    --card: rgba(255, 255, 255, 0.92);
    --card-subtle: #f1f5f9;
    --text: #0f172a;
    --text-2: #334155;
    --text-3: #64748b;
    --text-4: #94a3b8;
    --brand: #059669;
    --brand-light: #ecfdf5;
    --brand-hover: #047857;
    --brand-gradient: linear-gradient(135deg, #059669 0%, #0d9488 50%, #10b981 100%);
    --indigo: #6366f1;
    --indigo-light: #eef2ff;
    --amber: #d97706;
    --amber-light: #fffbeb;
    --teal: #0d9488;
    --teal-light: #f0fdfa;
    --rose: #e11d48;
    --rose-light: #fff1f2;
    --line-subtle: #f1f5f9;
    --band: rgba(16, 185, 129, 0.08);
    --radius-bento: 32px;
    --radius-card: 24px;
    --radius-tile: 20px;
    --radius-pill: 9999px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f1f5f9;
    background-image: radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.06), transparent 35%),
                      radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.05), transparent 40%),
                      radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.03), transparent 50%);
    background-attachment: fixed;
    color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  button, input, select { font: inherit; color: inherit; }

  /* App Header 仪表横梁 */
  .top-wrapper {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .top {
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    justify-content: space-between;
  }
  .brand-group {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand-logo {
    width: 48px;
    height: 48px;
    border-radius: 20px;
    background: var(--brand-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    box-shadow: 0 10px 24px -6px rgba(16, 185, 129, 0.45);
    flex-shrink: 0;
  }
  .brand-logo svg {
    width: 24px;
    height: 24px;
  }
  .brand-text h1 {
    font-size: 24px;
    font-weight: 900;
    margin: 0;
    line-height: 1.2;
    letter-spacing: -0.025em;
    color: #0f172a;
  }
  .brand-text .sub {
    color: var(--text-4);
    font-size: 12px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* 顶部动态家庭画像胶囊 */
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  .profile-pill {
    display: none;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(12px);
    padding: 6px 16px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
  }
  @media (min-width: 992px) {
    .profile-pill { display: flex; }
  }
  .profile-pill:hover {
    background: #ffffff;
    transform: scale(1.01);
  }
  .profile-pill-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
  }
  .profile-pill-label {
    font-weight: 700;
    color: var(--text-4);
  }
  .profile-pill-val {
    font-weight: 900;
    color: var(--text);
  }
  .pill-badge {
    font-size: 10px;
    font-weight: 900;
    padding: 1px 6px;
    border-radius: var(--radius-pill);
  }
  .pill-badge.indigo { background: var(--indigo-light); color: var(--indigo); }
  .pill-badge.amber { background: var(--amber-light); color: var(--amber); }
  .pill-badge.rose { background: var(--rose-light); color: var(--rose); }
  .pill-badge.emerald { background: var(--brand-light); color: var(--brand); }
  .pill-badge.slate { background: #f1f5f9; color: var(--text-3); }
  .profile-pill-sep {
    width: 1px;
    height: 12px;
    background: #e2e8f0;
  }

  .btn-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: none;
    border-radius: var(--radius-pill);
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-pill.primary {
    background: var(--brand);
    color: #ffffff;
    box-shadow: 0 6px 18px -4px rgba(16, 185, 129, 0.45);
  }
  .btn-pill.primary:hover {
    background: var(--brand-hover);
    transform: scale(1.02);
  }
  .btn-pill.secondary {
    background: rgba(255, 255, 255, 0.9);
    color: var(--text-2);
  }
  .btn-pill.secondary:hover {
    background: #ffffff;
    color: var(--brand);
    transform: scale(1.02);
  }

  /* 主画卷容器 (100%宽幅单页一体直接滚动) */
  .main-canvas {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 24px 80px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* 快速微调条 (Compact Dials) */
  .dials-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
  }
  .dial-card {
    border-radius: 20px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
    transition: transform 0.15s ease;
  }
  .dial-card:hover {
    transform: translateY(-2px);
  }
  .dial-card.emerald { background: var(--brand-light); }
  .dial-card.indigo { background: var(--indigo-light); }
  .dial-card.amber { background: var(--amber-light); }
  .dial-card.teal { background: var(--teal-light); }

  .dial-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .dial-label {
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dial-card.emerald .dial-label { color: #064e3b; }
  .dial-card.indigo .dial-label { color: #312e81; }
  .dial-card.amber .dial-label { color: #78350f; }
  .dial-card.teal .dial-label { color: #134e4a; }

  .dial-val {
    font-size: 17px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
  }
  .dial-card.emerald .dial-val { color: #064e3b; }
  .dial-card.indigo .dial-val { color: #312e81; }
  .dial-card.amber .dial-val { color: #78350f; }
  .dial-card.teal .dial-val { color: #134e4a; }
  .dial-val span { font-size: 11px; font-weight: 700; opacity: 0.7; }

  .dial-ctrl {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dial-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: #ffffff;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    transition: transform 0.1s ease;
    flex-shrink: 0;
  }
  .dial-btn:hover { transform: scale(1.1); }
  .dial-btn:active { transform: scale(0.95); }
  .dial-card.emerald .dial-btn { color: var(--brand); }
  .dial-card.indigo .dial-btn { color: var(--indigo); }
  .dial-card.amber .dial-btn { color: var(--amber); }
  .dial-card.teal .dial-btn { color: var(--teal); }

  .dial-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.06);
    outline: none;
  }
  .dial-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.2);
    cursor: pointer;
  }
  .dial-card.emerald .dial-slider { accent-color: var(--brand); }
  .dial-card.indigo .dial-slider { accent-color: var(--indigo); }
  .dial-card.amber .dial-slider { accent-color: var(--amber); }
  .dial-card.teal .dial-slider { accent-color: var(--teal); }

  /* Bento 基础卡片 */
  .bento-card {
    background: var(--card);
    border-radius: var(--radius-bento);
    padding: 28px;
    border: none;
  }
  .bento-section {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .bento-header {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bento-icon {
    width: 40px;
    height: 40px;
    border-radius: 16px;
    background: var(--brand-light);
    color: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .bento-icon svg { width: 18px; height: 18px; }
  .bento-title {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.02em;
    color: #0f172a;
    margin: 0;
  }
  .bento-desc {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-4);
    margin: 2px 0 0;
  }

  /* 首屏成就大卡 (Answer Card) */
  .answer-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 28px;
  }
  @media (max-width: 900px) {
    .answer-grid { grid-template-columns: 1fr; }
  }

  .earliest-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--brand-light);
    color: var(--brand);
    padding: 4px 12px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 800;
  }
  .pulse-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--brand);
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
  }
  .earliest-headline {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px;
  }
  .earliest-headline .prefix {
    font-size: 22px;
    font-weight: 900;
    color: #334155;
  }
  .earliest-headline .hero-age {
    font-size: 42px;
    font-weight: 950;
    letter-spacing: -0.03em;
    background: var(--brand-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .earliest-headline .suffix {
    font-size: 22px;
    font-weight: 900;
    color: var(--brand);
  }
  .earliest-meta {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    font-size: 13.5px;
    color: var(--text-3);
  }
  .earliest-meta b {
    color: var(--brand);
    font-weight: 900;
  }

  /* 倒计时药丸块 */
  .countdown-box {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .cd-tile {
    min-width: 60px;
    padding: 10px 12px;
    border-radius: 18px;
    background: #f1f5f9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .cd-tile.sec {
    background: var(--brand);
    color: #ffffff;
    box-shadow: 0 6px 18px -4px rgba(16, 185, 129, 0.5);
  }
  .cd-num {
    font-size: 26px;
    font-weight: 950;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--text);
  }
  .cd-tile.sec .cd-num { color: #ffffff; }
  .cd-unit {
    font-size: 11px;
    font-weight: 800;
    color: var(--text-4);
    margin-top: 4px;
  }
  .cd-tile.sec .cd-unit { color: rgba(255, 255, 255, 0.85); }

  /* 人生进度条 */
  .progress-wrap {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #f1f5f9;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .progress-bar-bg {
    position: relative;
    height: 12px;
    border-radius: 999px;
    background: #f1f5f9;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--brand-gradient);
    transition: width 0.5s ease;
  }
  .progress-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-4);
  }
  .progress-labels .highlight {
    color: var(--text);
  }
  .progress-labels .highlight b {
    color: var(--brand);
    font-weight: 900;
  }

  /* 你的计划目标面板 (Plan Panel) */
  .plan-panel {
    border-radius: 28px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 18px;
  }
  .plan-panel.ok { background: var(--brand-light); color: #064e3b; }
  .plan-panel.fail { background: var(--rose-light); color: #881337; }
  .plan-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .plan-tag {
    font-size: 11px;
    font-weight: 900;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .plan-panel.ok .plan-tag { background: #d1fae5; color: #065f46; }
  .plan-panel.fail .plan-tag { background: #ffe4e6; color: #9f1239; }
  .plan-title {
    margin: 8px 0 0;
    font-size: 17px;
    font-weight: 900;
    color: var(--text);
  }
  .plan-gap {
    font-size: 34px;
    font-weight: 950;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .plan-panel.ok .plan-gap { color: var(--brand); }
  .plan-panel.fail .plan-gap { color: var(--rose); }

  .plan-rows {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-top: 14px;
    border-top: 1px solid rgba(0, 0, 0, 0.05);
  }
  .plan-row-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.8);
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 12px;
  }
  .plan-row-label { color: var(--text-3); font-weight: 600; }
  .plan-row-val { font-weight: 900; color: var(--text); font-variant-numeric: tabular-nums; }
  .plan-row-val.danger { color: var(--rose); }

  .safety-tip {
    margin-top: 20px;
    border-radius: 20px;
    padding: 14px 18px;
    font-size: 13.5px;
    line-height: 1.6;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .safety-tip.strong { background: var(--brand-light); color: #064e3b; }
  .safety-tip.warn { background: var(--amber-light); color: #78350f; }

  /* 4 个关键事实便当盒 (KeyFacts) */
  .facts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .fact-card {
    border-radius: 24px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 14px;
    transition: transform 0.15s ease;
  }
  .fact-card:hover { transform: translateY(-2px); }
  .fact-card.emerald { background: var(--brand-light); }
  .fact-card.indigo { background: var(--indigo-light); }
  .fact-card.amber { background: var(--amber-light); }
  .fact-card.teal { background: var(--teal-light); }

  .fact-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .fact-icon-wrap {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fact-card.emerald .fact-icon-wrap { color: var(--brand); }
  .fact-card.indigo .fact-icon-wrap { color: var(--indigo); }
  .fact-card.amber .fact-icon-wrap { color: var(--amber); }
  .fact-card.teal .fact-icon-wrap { color: var(--teal); }
  .fact-icon-wrap svg { width: 16px; height: 16px; }

  .fact-pill {
    font-size: 10.5px;
    font-weight: 900;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .fact-card.emerald .fact-pill { background: #d1fae5; color: #065f46; }
  .fact-card.indigo .fact-pill { background: #e0e7ff; color: #3730a3; }
  .fact-card.amber .fact-pill { background: #fef3c7; color: #92400e; }
  .fact-card.teal .fact-pill { background: #ccfbf1; color: #115e59; }

  .fact-label { font-size: 12px; font-weight: 700; color: var(--text-3); margin: 0; }
  .fact-num { font-size: 30px; font-weight: 950; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: #0f172a; margin: 4px 0 0; }
  .fact-num span { font-size: 13px; font-weight: 700; color: var(--text-4); margin-left: 2px; }
  .fact-sub { font-size: 11.5px; font-weight: 600; color: var(--text-4); margin: 4px 0 0; }

  /* 怎么能更早退休 (Levers) */
  .levers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }
  .lever-btn {
    border-radius: 20px;
    padding: 18px;
    border: none;
    text-align: left;
    background: rgba(255, 255, 255, 0.9);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .lever-btn:hover { background: #ffffff; transform: translateY(-2px); }
  .lever-btn.active {
    background: #d1fae5;
  }
  .lever-name { font-size: 13.5px; font-weight: 900; color: #0f172a; margin: 0; }
  .lever-gain { font-size: 22px; font-weight: 950; color: var(--brand); margin: 8px 0 0; }
  .lever-gain.gray { color: var(--text-4); }
  .lever-sub { font-size: 11.5px; font-weight: 600; color: var(--text-4); margin: 4px 0 0; }

  /* 图表卡片 */
  .chart-box {
    position: relative;
    width: 100%;
    margin-top: 14px;
  }
  svg.chart {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }
  svg text.axis { fill: var(--text-4); font-size: 11px; font-weight: 600; font-family: inherit; }
  svg line.grid { stroke: #f1f5f9; stroke-width: 1; }
  svg line.zero { stroke: #cbd5e1; stroke-width: 1; }
  svg line.ref { stroke: #94a3b8; stroke-dasharray: 4 4; stroke-width: 1.5; }
  svg rect.band { fill: rgba(16, 185, 129, 0.08); }
  svg path.area { fill: rgba(16, 185, 129, 0.15); }
  svg path.line-plan { stroke: #059669; stroke-width: 3; fill: none; }
  svg path.line-min { stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 4 3; fill: none; }
  svg rect.bar-hit { fill: transparent; cursor: pointer; }
  svg rect.bar-hit:hover { fill: rgba(15, 23, 42, 0.04); }

  /* 检查点矩阵 */
  .ck-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    margin-top: 16px;
  }
  .ck-card {
    border-radius: 18px;
    padding: 14px;
    background: #f8fafc;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .ck-card.retire {
    background: var(--brand);
    color: #ffffff;
  }
  .ck-date { font-size: 11.5px; font-weight: 700; color: var(--text-4); }
  .ck-card.retire .ck-date { color: rgba(255, 255, 255, 0.85); }
  .ck-val { font-size: 20px; font-weight: 950; font-variant-numeric: tabular-nums; }
  .ck-card.retire .ck-val { color: #ffffff; }
  .ck-min { font-size: 11px; font-weight: 600; color: var(--text-4); }
  .ck-card.retire .ck-min { color: rgba(255, 255, 255, 0.75); }

  /* 压力测试与明细表格 */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 12px 14px; text-align: left; }
  th { background: #f8fafc; font-size: 11.5px; font-weight: 800; color: var(--text-4); text-transform: uppercase; }
  td { border-bottom: 1px solid #f8fafc; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.group td { background: #f8fafc; font-weight: 800; font-size: 11.5px; color: var(--text-3); }
  tr.base-row td { background: var(--brand-light); font-weight: 900; }
  tr.retire-row td { background: #d1fae5; font-weight: 900; }

  /* 弹窗 (Family Finance Modal) */
  .modal-backdrop {

const ym = (s) => {

  return m && +m[2] >= 1 && +m[2] <= 12 ? +m[1] * 12 + +m[2] - 1 : NaN;

const ymStr = (i) => `${Math.floor(i / 12)}-${String((i % 12) + 1).padStart(2, "0")}`;

const nowD = new Date();

  const ks = p.split(".");
  const last = ks.pop();

const statutory = (birthIdx, gender) => {
  const g = GENDERS[gender];
  if (!isFinite(birthIdx) || !g) return null;
  const n = birthIdx - g.start;
  const delay = n < 0 ? 0 : Math.min(g.max, Math.floor(n / g.per) + 1);
  return { date: birthIdx + g.base * 12 + delay, ageM: g.base * 12 + delay, delay, base: g.base };
};

const pensionMonthly = (base, index, years, retireAge) => {
  if (years <= 0) return 0;
  const basePart = ((base + base * index) / 2) * years * 0.01;
  const cMonths = CALC_MONTHS[retireAge] || 139;
  const persPart = (base * index * 0.08 * 12 * years) / cMonths;
  return basePart + persPart;
};

const minYearsAt = (dateIdx) => {
  const y = Math.floor(dateIdx / 12);
  if (y < 2030) return 15;
  return Math.min(20, 15 + (y - 2029) * 0.5);
};

const STAGES = ["0–2 岁（婴幼儿）", "3–5 岁（幼儿园）", "6–11 岁（小学）", "12–14 岁（初中）", "15–17 岁（高中）", "18–21 岁（大学）"];
const STAGE_NAMES = ["婴幼儿", "幼儿园", "小学", "初中", "高中", "大学"];
const stageIdx = (c) => (c <= 2 ? 0 : c <= 5 ? 1 : c <= 11 ? 2 : c <= 14 ? 3 : c <= 17 ? 4 : 5);
const newChild = () => ({ born: false, date: ymStr(NOW + 12) });

function kidCost(s, c, now) {
  const b = ym(c.date);
  if (!isFinite(b) || (!c.born && b < now)) return 0;
  const edu = realRate(s.eduGrowth || 3, s.infl || 1);
  let total = c.born ? 0 : (s.birthCost || 0) * 1e4;
  for (let t = Math.max(0, b - now); t - (b - now) < CHILD_MONTHS; t++) {
    const age = t - (b - now);
    total += (+s.stage[stageIdx(Math.floor(age / 12))] || 0) * Math.pow(1 + edu, t / 12);
  }
  return total;
}

const lastPensionDate = (s) => {
  const a = statutory(ym(s.me.birth), s.me.gender);
  const b = s.hasSpouse ? statutory(ym(s.spouse.birth), s.spouse.gender) : null;
  if (!a) return NaN;
  return b ? Math.max(a.date, b.date) : a.date;
};

const realRate = (pct, infl) => (1 + pct / 100) / (1 + infl / 100) - 1;

function toParams(s, now = NOW) {
  const b1 = ym(s.me.birth), b2 = s.hasSpouse ? ym(s.spouse.birth) : b1;
  const st1 = statutory(b1, s.me.gender), st2 = s.hasSpouse ? statutory(b2, s.spouse.gender) : null;
  const s1 = ym(s.stopMe), s2 = s.hasSpouse ? (s.together ? s1 : ym(s.stopSpouse)) : s1;
  const T1 = s1 - now, T2 = s2 - now;
  const P1 = st1 ? st1.date - now : T1, P2 = st2 ? st2.date - now : T2;
  const lastP = Math.max(P1, s.hasSpouse ? P2 : -Infinity);
  const covered = s.afterPension === "covered";
  const E = covered ? lastP : (b1 + s.endAge * 12) - now;
  let g = s.outlook === "up" ? s.upRate / 100 : s.outlook === "down" ? -s.downRate / 100 : 0;
  let cut1 = 1e9, cut2 = 1e9, cutF = 1;
  if (s.outlook === "unstable") {
    cut1 = (b1 + s.cutAge * 12) - now;
    cut2 = (b2 + s.cutAge * 12) - now;
    cutF = s.cutPct / 100;
  }
  return {
    now, sp: s.hasSpouse, b1, b2, st1, st2, P1, P2, T1, T2,
    together: s.together, covered, lastP, endAge: s.endAge, E,
    inc1: s.inc1, inc2: s.hasSpouse ? s.inc2 : 0, bonus1: s.bonus1 * 1e4, bonus2: s.hasSpouse ? s.bonus2 * 1e4 : 0,
    g, cut1, cut2, cutF, assets: s.assets * 1e4,
    r: realRate(s.ret, s.infl), infl: s.infl / 100,
    floor: s.floor * 1e4,
    livingWork: s.livingWork, rent: s.hasRent ? s.rent : 0,
    livingBridge: s.livingBridge, livingPension: s.livingPension,
    mort: s.hasMortgage ? s.mortMonthly : 0, mortEnd: s.hasMortgage ? ym(s.mortEnd) - now : -1,
    hf: s.hasMortgage ? s.hfOffset : 0,
    debts: s.debts.map((d) => ({ name: d.name, monthly: d.monthly, end: ym(d.end) - now })),
    kids: s.hasKids, children: s.hasKids ? s.children : [],
    stage: s.stage, edu: realRate(s.eduGrowth, s.infl), childTax: s.childTax,
    one: s.oneOffs.map((o) => ({ name: o.name, date: ym(o.date) - now, amount: o.amount * 1e4, every: o.every })),
    mode: s.pensionMode, pension1: s.pension1, pension2: s.hasSpouse ? s.pension2 : 0,
    base: s.calcBase, idx1: s.index1, yrs1: s.years1, idx2: s.index2, yrs2: s.years2,
    siAfter: s.siAfter, flex: s.flexPension, med: s.med,
    incomes: s.incomes.map((i) => ({ name: i.name, monthly: i.monthly, from: (b1 + i.from * 12) - now, to: (b1 + (i.to + 1) * 12) - now })),
    shock1: [], shock2: [],
  };
}

function simulate(p) {
  const rows = [];
  const infM = Math.pow(1 + p.infl, 1 / 12);
  let wM1 = p.yrs1 * 12, wM2 = p.yrs2 * 12;
  for (let t = 0; t < p.E; t++) {
    const age1 = p.now + t - p.b1, age2 = p.sp ? p.now + t - p.b2 : 0;
    const w1 = t < p.T1, w2 = p.sp && t < p.T2;
    const inflScale = Math.pow(infM, -t);
    const gr1 = Math.pow(1 + p.g, t / 12) * (t >= p.cut1 ? p.cutF : 1);
    const gr2 = Math.pow(1 + p.g, t / 12) * (t >= p.cut2 ? p.cutF : 1);
    let s1 = w1 ? p.inc1 * gr1 : 0, s2 = w2 ? p.inc2 * gr2 : 0;
    for (const [a, b, f] of p.shock1) if (t >= a && t < b) s1 *= f;
    for (const [a, b, f] of p.shock2) if (t >= a && t < b) s2 *= f;
    let b1 = w1 ? (p.bonus1 / 12) * gr1 : 0, b2 = w2 ? (p.bonus2 / 12) * gr2 : 0;
    let hf = (w1 || w2) && t <= p.mortEnd ? p.hf * Math.min(1, (s1 + s2) / Math.max(1, p.inc1 + p.inc2)) : 0;
    if (w1) wM1++;
    if (w2) wM2++;
    let pen1 = 0, pen2 = 0;
    if (t >= p.P1) pen1 = p.mode === "formula" ? pensionMonthly(p.base, p.idx1, wM1 / 12, Math.floor(p.st1.ageM / 12)) : p.pension1;
    if (p.sp && t >= p.P2) pen2 = p.mode === "formula" ? pensionMonthly(p.base, p.idx2, wM2 / 12, Math.floor(p.st2.ageM / 12)) : p.pension2;
    let other = 0;
    for (const i of p.incomes) if (t >= i.from && t < i.to) other += i.monthly;
    let child = 0;
    if (p.kids) {
      for (const c of p.children) {
        const b = ym(c.date) - p.now;
        const age = t - b;
        if (age >= 0 && age < CHILD_MONTHS) {
          const stIdx = Math.min(5, Math.floor(age / 36));
          child += Math.max(0, p.stage[stIdx] * Math.pow(1 + p.edu, t / 12) - ((w1 || w2) ? p.childTax : 0));
        }
      }
    }
    let mort = t <= p.mortEnd ? p.mort : 0;
    let debt = 0;
    for (const d of p.debts) if (t <= d.end) debt += d.monthly;
    let med = 0, si = 0;
    if (!w1 && t < p.P1) med += p.med;
    if (p.sp && !w2 && t < p.P2) med += p.med;
    const minY1 = p.st1 ? minYearsAt(p.st1.date) : 15;
    const needSi1 = p.siAfter === "continue" || wM1 < minY1 * 12;
    if (!w1 && t < p.P1 && needSi1) { si += p.flex; wM1++; }
    if (p.sp && !w2 && t < p.P2) {
      const minY2 = p.st2 ? minYearsAt(p.st2.date) : 15;
      const needSi2 = p.siAfter === "continue" || wM2 < minY2 * 12;
      if (needSi2) { si += p.flex; wM2++; }
    }
    let one = 0;
    for (const o of p.one) {
      if (o.every > 0) {
        if (t >= o.date && (t - o.date) % (o.every * 12) === 0) one += o.amount;
      } else if (t === o.date) one += o.amount;
    }
    const anyWork = w1 || w2;
    const afterAllP = t >= p.lastP;
    const baseLiving = anyWork ? p.livingWork : afterAllP ? p.livingPension : p.livingBridge;
    const living = baseLiving * inflScale;
    const rent = anyWork ? p.rent * inflScale : 0;
    const inc = (s1 + s2 + b1 + b2 + hf) * inflScale + pen1 + pen2 + other;
    const exp = (mort + debt + med + si + one) * inflScale + child;
    const net = inc - exp - rent;
    rows.push({
      t, working: anyWork, living, rent: rent,
      salary: (s1 + s2) * inflScale, bonus: (b1 + b2) * inflScale, hf: hf * inflScale,
      pension: pen1 + pen2, other, mort: mort * inflScale, debt: debt * inflScale,
      child, med: med * inflScale, si: si * inflScale, one: one * inflScale, net,
    });
  }
  return { rows, m1: wM1, m2: wM2, pen1: 0, pen2: 0 };
}

function analyze(p) {
  const sim = simulate(p);
  const rows = sim.rows;
  const E = rows.length;
  const T = Math.max(0, Math.min(E, p.T1));
  const rm = Math.pow(1 + p.r, 1 / 12) - 1;
  let A = p.assets;
  let FV = 0;
  for (let t = 0; t < T; t++) {
    A = A * (1 + rm) + rows[t].net;
    FV = FV * (1 + rm) + 1;
  }
  let C = 0, disc = 1, need = p.floor;
  for (let t = T; t < E; t++) {
    C = C * (1 + rm) + rows[t].net;
    disc *= 1 + rm;
    need = Math.max(need, (p.floor - C) / disc);
  }
  const have = A - p.livingWork * FV;
  return { T, E, rm, need, have, gap: have - need, ceiling: FV > 0 ? (A - need) / FV : NaN, P0: A, FV, rows, sim };
}

function assetPath(p, a, living) {
  let A = p.assets;
  const out = [A];
  for (const row of a.rows) {
    A = A * (1 + a.rm) + row.net - (row.working ? living : 0);
    out.push(A);
  }
  return out;
}

function withStop(p, T) {
  return { ...p, T1: T, T2: p.sp ? (p.together ? T : p.T2) : 0 };
}

function earliest(p) {
  const maxT = Math.min(p.E, p.b1 + 75 * 12 - p.now);
  if (maxT < 1) return null;
  const ok = (T) => analyze(withStop(p, T)).gap >= 0;
  let prev = 0;
  for (let T = 1; ; T += 12) {
    const c = Math.min(T, maxT);
    if (ok(c)) {
      for (let x = prev + 1; x < c; x++) if (ok(x)) return x;
      return c;
    }
    if (c >= maxT) return null;
    prev = c;
  }
}

function riskAges(p) {
  const cur = Math.floor((p.now - p.b1) / 12);
  const R = Math.floor((p.now + p.T1 - p.b1) / 12);
  const a5 = Math.max(cur + 1, R - 5);
  const a10 = Math.max(cur + 1, R - 10);
  return { cur, R, a5, a10 };
}

function scenarioList(p) {
  const list = [];
  list.push({ id: "base", name: "现在设定好的情况", job: true, p });
  const { a5, a10 } = riskAges(p);
  const t5 = (p.b1 + a5 * 12) - p.now, t10 = (p.b1 + a10 * 12) - p.now;
  list.push({ id: "h5", name: `${a5} 岁收入减半`, job: true, p: { ...p, shock1: [[t5, 999, 0.5]], shock2: [] } });
  list.push({ id: "h5out", name: `${a5} 岁后没有收入`, job: true, p: { ...p, shock1: [[t5, 999, 0]], shock2: [] } });
  list.push({ id: "h10", name: `${a10} 岁收入减半`, job: true, p: { ...p, shock1: [[t10, 999, 0.5]], shock2: [] } });
  list.push({ id: "h10out", name: `${a10} 岁后没有收入`, job: true, p: { ...p, shock1: [[t10, 999, 0]], shock2: [] } });
  list.push({ id: "retDown", name: "投资年化收益少 1%", job: false, p: { ...p, r: Math.max(0, p.r - 0.01) } });
  list.push({ id: "spendUp", name: "提前退休后每月多花 1,000", job: false, p: { ...p, livingBridge: p.livingBridge + 1000, livingPension: p.livingPension + 1000 } });
  return list;
}

function buildLevers(s) {
  const baseP = toParams(s, NOW);
  const baseEarliest = earliest(baseP);
  const list = [
    { id: "cut500", name: "工作期间少花 500 元", patch: { livingWork: Math.max(1000, s.livingWork - 500) } },
    { id: "cut1000", name: "工作期间少花 1,000 元", patch: { livingWork: Math.max(1000, s.livingWork - 1000) } },
    { id: "bridge500", name: "退休后少花 500 元", patch: { livingBridge: Math.max(1000, s.livingBridge - 500), livingPension: Math.max(1000, s.livingPension - 500) } },
    { id: "earn1000", name: "工作期每月多赚 1,000 元", patch: { inc1: s.inc1 + 1000 } },
    { id: "ret1", name: "投资年化收益 +1%", patch: { ret: s.ret + 1 } },
  ];
  return list.map((item) => {
    const nextState = { ...s, ...item.patch };
    const e = earliest(toParams(nextState, NOW));
    return { ...item, earliest: e, baseEarliest };
  });
}

function sanitize(raw) {
  const s = clone(DEFAULTS);
  if (!raw || typeof raw !== "object") return s;
  for (const k of Object.keys(s)) {
    if (raw[k] !== undefined) s[k] = raw[k];
  }
  // 备用金单位防御（避免万元与元混淆）
  if (isNum(s.floor) && s.floor >= 1000) {
    s.floor = Math.round(s.floor / 1e4);
  }
  return s;
}

let S = clone(DEFAULTS);
try {
  const saved = localStorage.getItem("retirement-planner-v1");
  if (saved) S = sanitize(JSON.parse(saved));
} catch (e) {}

function save() {
  try {
    localStorage.setItem("retirement-planner-v1", JSON.stringify(S));
  } catch (e) {}
}

// ==================== 2. SVG 图表绘制 ====================
function niceStep(range, ticks = 6) {
  const raw = range / ticks || 1;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
}
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function label(parent, x, y, text, attrs) {
  const t = el("text", { x, y, ...attrs }, parent);
  t.textContent = text;
  return t;
}
function makeTip(box) {
  let tip = box.querySelector(".tip");
  if (!tip) {
    tip = document.createElement("div");
    tip.className = "tip";
    box.appendChild(tip);
  }
  return {
    show(html, evt) {
      tip.innerHTML = html;
      tip.style.display = "block";
      const r = box.getBoundingClientRect();
      let x = evt.clientX - r.left + 14;
      if (x + tip.offsetWidth > r.width) x = evt.clientX - r.left - tip.offsetWidth - 14;
      tip.style.left = Math.max(0, x) + "px";
      tip.style.top = evt.clientY - r.top + 14 + "px";
    },
    hide() { tip.style.display = "none"; },
  };
}
const tipRow = (color, name, value) =>
  `<div class="row"><span>${color ? `<i style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:${color}"></i>` : ""}${name}</span><span>${value}</span></div>`;

function yScale(values, H, m, minZero = true) {
  let lo = Math.min(...values), hi = Math.max(...values);
  if (minZero) lo = Math.min(0, lo);
  hi = Math.max(hi, lo + 1);
  const step = niceStep(hi - lo);
  lo = Math.floor(lo / step) * step;
  hi = Math.ceil((hi * 1.04) / step) * step;
  const Y = (v) => H - m.b - ((v - lo) / (hi - lo)) * (H - m.t - m.b);
  return { lo, hi, step, Y };
}
function yGrid(svg, sc, W, m, fmtV) {
  for (let v = sc.lo; v <= sc.hi + 1e-9; v += sc.step) {
    el("line", { x1: m.l, x2: W - m.r, y1: sc.Y(v), y2: sc.Y(v), class: Math.abs(v) < 1e-9 ? "zero" : "grid" }, svg);
    label(svg, m.l - 8, sc.Y(v) + 4, fmtV(v), { class: "axis", "text-anchor": "end" });
  }
}

function lineChart(box, { xs, series, ref, band, xStep, titles }) {
  box.innerHTML = "";
  const W = 960, H = 320, m = { l: 60, r: 16, t: 20, b: 34 };
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart" }, box);
  const allVals = series.flatMap((s) => s.values).concat(ref ? [ref.value] : []);
  const sc = yScale(allVals, H, m);
  yGrid(svg, sc, W, m, (v) => `${Math.round(v)} 万`);
  const X = (x) => m.l + ((x - xs[0]) / (xs[xs.length - 1] - xs[0])) * (W - m.l - m.r);
  if (band) {
    const x1 = Math.max(m.l, X(band.from)), x2 = Math.min(W - m.r, X(band.to));
    el("rect", { x: x1, y: m.t, width: x2 - x1, height: H - m.t - m.b, class: "band" }, svg);
    label(svg, (x1 + x2) / 2, m.t + 16, band.label, { class: "axis", "text-anchor": "middle", fill: "#059669", "font-weight": "700" });
    el("line", { x1, x2: x1, y1: m.t, y2: H - m.b, stroke: "#059669", "stroke-width": 1.5, "stroke-dasharray": "3 3" }, svg);
  }
  for (let i = 0; i < xs.length; i++) {
    const x = xs[i];
    if ((x - xs[0]) % xStep === 0) label(svg, X(x), H - m.b + 20, x, { class: "axis", "text-anchor": "middle" });
  }
  if (ref) {
    el("line", { x1: m.l, x2: W - m.r, y1: sc.Y(ref.value), y2: sc.Y(ref.value), class: "ref" }, svg);
    label(svg, m.l + 8, sc.Y(ref.value) - 6, ref.label, { class: "axis", fill: "#64748b", "font-weight": "700" });
  }
  series.forEach((s) => {
    const pts = s.values.map((v, i) => [X(xs[i]), sc.Y(v)]);
    if (s.name.includes("按每月花")) {
      const areaPts = pts.concat([[X(xs[xs.length - 1]), sc.Y(0)], [X(xs[0]), sc.Y(0)]]);
      el("path", { d: areaPts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join("") + "Z", class: "area" }, svg);
    }
    el("path", { d: pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join(""), class: s.name.includes("最低线") ? "line-min" : "line-plan" }, svg);
  });
  const tip = makeTip(box);
  const overlay = el("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent", cursor: "crosshair" }, svg);
  overlay.addEventListener("mousemove", (evt) => {
    const rect = box.getBoundingClientRect();
    const curX = ((evt.clientX - rect.left) / rect.width) * W;
    const curAge = xs[0] + ((curX - m.l) / (W - m.l - m.r)) * (xs[xs.length - 1] - xs[0]);
    let best = 0;
    for (let i = 0; i < xs.length; i++) if (Math.abs(xs[i] - curAge) < Math.abs(xs[best] - curAge)) best = i;
    tip.show(`<b>${titles[best]}</b>` + series.map((s) => tipRow(s.color, s.name, `${s.values[best].toFixed(1)} 万`)).join(""), evt);
  });
  overlay.addEventListener("mouseleave", () => tip.hide());
}

function groupedBars(box, { cats, series, ref }) {
  box.innerHTML = "";
  const W = 960, H = 280, m = { l: 60, r: 16, t: 16, b: 34 };
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart" }, box);
  const vals = series.flatMap((s) => s.values).concat(ref ? [ref.value] : []);
  const sc = yScale(vals, H, m);
  yGrid(svg, sc, W, m, (v) => fmt(v));
  const gw = (W - m.l - m.r) / cats.length;
  const bw = Math.min(32, (gw * 0.7) / series.length);
  const tip = makeTip(box);
  cats.forEach((c, i) => {
    const gx = m.l + i * gw;
    const hitRect = el("rect", { x: gx, y: m.t, width: gw, height: H - m.t - m.b, class: "bar-hit" }, svg);
    series.forEach((s, k) => {
      const v = Math.max(0, s.values[i]);
      const x = gx + gw / 2 - (bw * series.length) / 2 + k * bw + 1;
      el("rect", { x, y: sc.Y(v), width: bw - 2, height: Math.max(0, sc.Y(0) - sc.Y(v)), rx: 6, fill: s.color, "pointer-events": "none" }, svg);
    });
    label(svg, gx + gw / 2, H - m.b + 20, c.label, { class: "axis", "text-anchor": "middle" });
    hitRect.addEventListener("mousemove", (evt) =>
      tip.show(`<b>${c.title}</b>` + series.map((s) => tipRow(s.color, s.name, ceilText(s.values[i]))).join(""), evt));
    hitRect.addEventListener("mouseleave", () => tip.hide());
  });
  if (ref) el("line", { x1: m.l, x2: W - m.r, y1: sc.Y(ref.value), y2: sc.Y(ref.value), class: "ref", "pointer-events": "none" }, svg);
}

function stackedBars(box, { cats, segs, line, xStep, titles }) {
  box.innerHTML = "";
  const W = 960, H = 300, m = { l: 60, r: 16, t: 16, b: 34 };
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart" }, box);
  const totals = cats.map((_, i) => segs.reduce((s, g) => s + Math.max(0, g.values[i]), 0));
  const sc = yScale(totals.concat(line.values), H, m);
  yGrid(svg, sc, W, m, (v) => `${+v.toFixed(1)} 万`);
  const gw = (W - m.l - m.r) / cats.length;
  const bw = Math.max(3, gw * 0.64);
  const tip = makeTip(box);
  const pts = [];
  cats.forEach((c, i) => {
    const gx = m.l + i * gw;
    const hitRect = el("rect", { x: gx, y: m.t, width: gw, height: H - m.t - m.b, class: "bar-hit" }, svg);
    let acc = 0;
    for (const g of segs) {
      const v = Math.max(0, g.values[i]);
      if (v <= 0) continue;
      el("rect", { x: gx + (gw - bw) / 2, y: sc.Y(acc + v), width: bw, height: Math.max(0, sc.Y(acc) - sc.Y(acc + v)), rx: 3, fill: g.color, "pointer-events": "none" }, svg);
      acc += v;
    }
    pts.push([gx + gw / 2, sc.Y(line.values[i])]);
    if ((c - cats[0]) % xStep === 0) label(svg, gx + gw / 2, H - m.b + 20, c, { class: "axis", "text-anchor": "middle" });
    hitRect.addEventListener("mousemove", (evt) =>
      tip.show(
        `<b>${titles[i]}</b>` +
          segs.map((g) => (g.values[i] > 0.005 ? tipRow(g.color, g.name, `${g.values[i].toFixed(1)} 万`) : "")).join("") +
          tipRow("", "支出合计", `${totals[i].toFixed(1)} 万`) +
          tipRow(line.color, line.name, `${line.values[i].toFixed(1)} 万`) +
          tipRow("", "<b>要从存款里拿</b>", `<b>${(totals[i] - line.values[i]).toFixed(1)} 万</b>`),
        evt
      ));
    hitRect.addEventListener("mouseleave", () => tip.hide());
  });
  el("path", { d: pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join(""), stroke: line.color, "stroke-width": 2.5, fill: "none", "pointer-events": "none" }, svg);
}

window.updateDial = function(key, val) {
  if (key === "livingWork") S.livingWork = Math.max(1000, Math.min(60000, val));
  if (key === "stopAgeMe") {
    S.stopAgeMe = val;
    const b1 = ym(S.me.birth);
    if (isFinite(b1)) S.stopMe = ymStr(b1 + val * 12);
    if (S.together && S.hasSpouse) {
      S.stopAgeSpouse = val;
      const b2 = ym(S.spouse.birth);
      if (isFinite(b2)) S.stopSpouse = ymStr(b2 + val * 12);
    }
  }
  if (key === "ret") S.ret = Math.max(0, Math.min(15, Math.round(val * 10) / 10));
  if (key === "floor") S.floor = Math.max(0, Math.min(200, val));
  save();
  renderHeaderPills();
  renderCompactDials();
  renderResults();
};

// 倒计时刷新器
function updateCountdown(targetDate, birthMonthIdx) {
  const now = new Date();
  const diffSec = Math.max(0, Math.floor((targetDate.getTime() - now.getTime()) / 1000));
  const days = Math.floor(diffSec / 86400);

  const daysText = document.getElementById("cd-days-text");
  if (daysText) daysText.textContent = fmt(days);

  // 年月日时分秒拆解
  let cur = new Date(now.getTime());
  let years = targetDate.getFullYear() - cur.getFullYear();
  let temp = new Date(cur.getFullYear() + years, cur.getMonth(), cur.getDate(), cur.getHours(), cur.getMinutes(), cur.getSeconds());
  if (temp > targetDate) { years--; }
  cur.setFullYear(cur.getFullYear() + years);

  let months = (targetDate.getFullYear() - cur.getFullYear()) * 12 + (targetDate.getMonth() - cur.getMonth());
  if (targetDate.getDate() < cur.getDate()) months--;
  months = Math.max(0, months);
  cur.setMonth(cur.getMonth() + months);

  let restD = Math.max(0, Math.floor((targetDate.getTime() - cur.getTime()) / 86400000));
  const remSec = diffSec % 86400;
  const h = Math.floor(remSec / 3600);
  const m = Math.floor((remSec % 3600) / 60);
  const s = remSec % 60;

  const pad = (n) => String(n).padStart(2, "0");
  const elY = document.getElementById("cd-y");
  const elM = document.getElementById("cd-m");
  const elD = document.getElementById("cd-d");
  const elH = document.getElementById("cd-h");
  const elMin = document.getElementById("cd-min");
  const elS = document.getElementById("cd-s");

  if (elY) elY.textContent = years;
  if (elM) elM.textContent = months;
  if (elD) elD.textContent = restD;
  if (elH) elH.textContent = pad(h);
  if (elMin) elMin.textContent = pad(m);
  if (elS) elS.textContent = pad(s);

  // 进度条以提前退休时间为 100% 终点
  const birthDate = new Date(Math.floor(birthMonthIdx / 12), birthMonthIdx % 12, 1);
  const totalMs = targetDate.getTime() - birthDate.getTime();
  const passedMs = now.getTime() - birthDate.getTime();
  const pct = totalMs > 0 ? Math.min(100, Math.max(0, (passedMs / totalMs) * 100)) : 100;

  const bar = document.getElementById("life-progress-bar");
  const pctText = document.getElementById("life-progress-pct");
  if (bar) bar.style.width = `${pct}%`;
  if (pctText) pctText.textContent = `${pct.toFixed(2)}%`;
}

function drawCharts(p, a, plan, minLine, jobAges, lossHalf, lossPerm) {
  const ageAt = (t) => Math.floor((NOW + t - p.b1) / 12);
  const ks = [];
  for (let t = 0; t <= a.E; t += 12) ks.push(t);
  const xs = ks.map(ageAt);
  const series = [{ name: `按每月花 ${fmt(S.livingWork)}`, color: "#059669", values: ks.map((t) => plan[t] / 1e4) }];
  if (minLine) series.push({ name: "最低线", color: "#f59e0b", values: ks.map((t) => minLine[t] / 1e4) });
  const span = xs[xs.length - 1] - xs[0];
  lineChart(document.getElementById("chart-path"), {
    xs, series,
    titles: ks.map((t, i) => `你 ${xs[i]} 岁（${fmtYM(NOW + t)}）`),
    ref: { value: a.need / 1e4, label: `提前退休时需要 ${wan(a.need)}` },
    band: { from: xs[0] + p.T1 / 12, to: xs[xs.length - 1], label: "提前退休后" },
    xStep: span > 40 ? 5 : span > 20 ? 2 : 1,
  });

  const jobBox = document.getElementById("chart-job");
  if (jobBox) {
    groupedBars(jobBox, {
      cats: jobAges.map((x) => ({ label: `${x} 岁`, title: `你 ${x} 岁失业` })),
      series: [
        { name: "1 年后收入减半", color: "#059669", values: lossHalf.map((v) => (isFinite(v) ? floor100(v) : 0)) },
        { name: "再也找不到工作", color: "#f59e0b", values: lossPerm.map((v) => (isFinite(v) ? floor100(v) : 0)) },
      ],
      ref: { value: S.livingWork },
    });
  }

  const starts = [];
  for (let s = a.T; s < a.E; s += 12) starts.push(s);
  const blk = (f) => starts.map((s) => a.rows.slice(s, s + 12).reduce((x, r) => x + f(r), 0) / 1e4);
  const cats = starts.map(ageAt);
  stackedBars(document.getElementById("chart-post"), {
    cats,
    titles: starts.map((s, i) => `你 ${cats[i]} 岁（${shortYM(NOW + s)}–${shortYM(NOW + Math.min(s + 12, a.E) - 1)}）`),
    segs: [
      { name: "日常开支", color: "#059669", values: blk((r) => r.living) },
      { name: "孩子", color: "#f59e0b", values: blk((r) => r.child) },
      { name: "房贷和负债", color: "#8b5cf6", values: blk((r) => r.mort + r.debt) },
      { name: "社保医保", color: "#06b6d4", values: blk((r) => r.med + r.si) },
      { name: "大额支出", color: "#ec4899", values: blk((r) => r.one) },
    ],
    line: { name: "收入", color: "#0f172a", values: blk((r) => r.pension + r.other + r.salary + r.bonus + r.hf) },
    xStep: cats.length > 30 ? 5 : cats.length > 15 ? 2 : 1,
  });
}

              <span class="f-label" style="font-size:11px;">你每月养老金</span>
              <div class="f-inp-wrap"><input type="number" step="100" value="${S.pension1}" onchange="updateInput('pension1', +this.value)"><span class="f-unit">元</span></div>
            </div>
            ${S.hasSpouse ? `
              <div class="f-row">
                <span class="f-label" style="font-size:11px;">伴侣每月养老金</span>
                <div class="f-inp-wrap"><input type="number" step="100" value="${S.pension2}" onchange="updateInput('pension2', +this.value)"><span class="f-unit">元</span></div>
              </div>
            ` : ""}
          </div>
        `}

        <div class="f-row" style="margin-top:12px;">
          <span class="f-label">提前退休后的养老保险缴纳方式</span>
          <div class="f-inp-wrap">
            <select onchange="updateInput('siAfter', this.value)">
              <option value="stop" ${S.siAfter === "stop" ? "selected" : ""}>停交（不够法定最低年限就补够）</option>
              <option value="continue" ${S.siAfter === "continue" ? "selected" : ""}>自己交到正式领养老金</option>
            </select>
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;">
          <div class="f-row">
            <span class="f-label" style="font-size:11px;">自交养老保险</span>
            <div class="f-inp-wrap"><input type="number" step="50" value="${S.flexPension}" onchange="updateInput('flexPension', +this.value)"><span class="f-unit">元/人/月</span></div>
          </div>
          <div class="f-row">
            <span class="f-label" style="font-size:11px;">自交医保费用</span>
            <div class="f-inp-wrap"><input type="number" step="50" value="${S.med}" onchange="updateInput('med', +this.value)"><span class="f-unit">元/人/月</span></div>
          </div>
        </div>
      </div>

      <div class="f-group">
        <h4 style="margin:0 0 4px; font-size:14px; font-weight:900;">其他被动与副业收入</h4>
        <span class="f-hint" style="margin-bottom:8px;">工资和养老金以外的确定性收入，比如租金、轻量副业等。</span>

        <div style="display:flex; flex-direction:column; gap:10px;">
          ${(S.incomes || []).map((o, idx) => `
            <div style="background:#ffffff; border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:8px;">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <input type="text" value="${o.name}" style="font-weight:900; font-size:13.5px; border:none; outline:none;" onchange="updateIncomeItem(${idx}, 'name', this.value)">
                <button type="button" class="dial-btn" onclick="removeIncome(${idx})">✕</button>
              </div>
              <div class="f-row">
                <span class="f-label" style="font-size:11px;">每月金额</span>
                <div class="f-inp-wrap"><input type="number" step="100" value="${o.monthly}" onchange="updateIncomeItem(${idx}, 'monthly', +this.value)"><span class="f-unit">元/月</span></div>
              </div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="f-row">
                  <span class="f-label" style="font-size:11px;">从你几岁开始</span>
                  <div class="f-inp-wrap"><input type="number" step="1" value="${o.from}" onchange="updateIncomeItem(${idx}, 'from', Math.round(+this.value))"><span class="f-unit">岁</span></div>
                </div>
                <div class="f-row">
                  <span class="f-label" style="font-size:11px;">到你几岁结束(含)</span>
                  <div class="f-inp-wrap"><input type="number" step="1" value="${o.to}" onchange="updateIncomeItem(${idx}, 'to', Math.round(+this.value))"><span class="f-unit">岁</span></div>
                </div>
              </div>
            </div>
          `).join("")}

          <button type="button" class="btn-pill secondary" onclick="addNewIncome()" style="justify-content:center;">+ 添加一项其他收入</button>
        </div>
      </div>
    `;
  }
}

function syncStops(s) {
  const b1 = ym(s.me.birth);
  const b2 = ym(s.spouse.birth);
  if (isFinite(b1)) s.stopMe = ymStr(b1 + s.stopAgeMe * 12);
  if (isFinite(b2)) s.stopSpouse = ymStr(b2 + s.stopAgeSpouse * 12);
}

// 统一数据变更同步并刷新界面
function applyStateChange(rerenderModal = true) {
  syncStops(S);
  save();
  renderHeaderPills();
  renderCompactDials();
  renderResults();
  if (rerenderModal) {
    renderModalNav();
    renderModalContent();
  }
}
window.applyStateChange = applyStateChange;

function updateSpouse(val) {
  S.hasSpouse = val;
  applyStateChange(true);
}
window.updateSpouse = updateSpouse;

function updateInput(path, val) {
  setPath(S, path, val);
  if (path === "hasMortgage" && S.hasMortgage && !(ym(S.mortEnd) >= NOW)) {
    S.mortEnd = ymStr(NOW + 239);
  }
  // 如果是结构性字段切换，需要立即重新渲染弹窗内容以展现或隐藏联动字段
  const structuralFields = [
    "hasMortgage", "hasRent", "hasKids", "hasSpouse", "together",
    "outlook", "pensionMode", "afterPension", "siAfter", "me.gender", "spouse.gender"
  ];
  const needRerender = structuralFields.includes(path) || path.includes("birth");
  applyStateChange(needRerender);
}
window.updateInput = updateInput;

function updateStopAge(who, val) {
  if (who === "me") {
    S.stopAgeMe = val;
    if (S.together && S.hasSpouse) {
      S.stopAgeSpouse = val;
    }
  } else {
    S.stopAgeSpouse = val;
  }
  applyStateChange(true);
}
window.updateStopAge = updateStopAge;

function updateKidsToggle(checked) {
  S.hasKids = checked;
  if (checked && (!S.children || !S.children.length)) {
    S.children = [newChild()];
  }
  applyStateChange(true);
}
window.updateKidsToggle = updateKidsToggle;

function setKidBorn(idx, born) {
  const c = S.children[idx];
  c.born = born;
  c.date = born ? todayStr : ymStr(NOW + 12);
  applyStateChange(true);
}
window.setKidBorn = setKidBorn;

function updateKidDate(idx, date) {
  S.children[idx].date = date;
  applyStateChange(true);
}
window.updateKidDate = updateKidDate;

function removeKid(idx) {
  S.children.splice(idx, 1);
  if (!S.children.length) S.hasKids = false;
  applyStateChange(true);
}
window.removeKid = removeKid;

function addNewKid() {
  if (!S.children) S.children = [];
  S.children.push(newChild());
  applyStateChange(true);
}
window.addNewKid = addNewKid;

function updateStageCost(idx, val) {
  S.stage[idx] = val;
  applyStateChange(false);
}
window.updateStageCost = updateStageCost;

function updateDebtItem(idx, key, val) {
  S.debts[idx][key] = val;
  applyStateChange(key === 'end');
}
window.updateDebtItem = updateDebtItem;

function removeDebt(idx) {
  S.debts.splice(idx, 1);
  applyStateChange(true);
}
window.removeDebt = removeDebt;

function addNewDebt() {
  if (!S.debts) S.debts = [];
  S.debts.push({ name: "车贷", monthly: 2000, end: ymStr(NOW + 35) });
  applyStateChange(true);
}
window.addNewDebt = addNewDebt;

function addOneOffByPreset(presetKey) {
  S.oneOffs.push(presetItem(S, presetKey));
  applyStateChange(true);
}
window.addOneOffByPreset = addOneOffByPreset;

function updateOneOffItem(idx, key, val) {
  S.oneOffs[idx][key] = val;
  applyStateChange(key === 'every' || key === 'date');
}
window.updateOneOffItem = updateOneOffItem;

function removeOneOff(idx) {
  S.oneOffs.splice(idx, 1);
  applyStateChange(true);
}
window.removeOneOff = removeOneOff;

function addOneOffPreset() {
  S.oneOffs.push({ name: "大额预算", date: ymStr(NOW + 60), amount: 10, every: 0 });
  applyStateChange(true);
}
window.addOneOffPreset = addOneOffPreset;

function addNewIncome() {
  if (!S.incomes) S.incomes = [];
  const a0 = stopAgeYears(S);
  S.incomes.push({ name: "其他收入", monthly: 1000, from: a0, to: a0 + 9 });
  applyStateChange(true);
}
window.addNewIncome = addNewIncome;

function updateIncomeItem(idx, key, val) {
  S.incomes[idx][key] = val;
  applyStateChange(false);
}
window.updateIncomeItem = updateIncomeItem;

function removeIncome(idx) {
  S.incomes.splice(idx, 1);
  applyStateChange(true);
}
window.removeIncome = removeIncome;

// 按钮监听绑定
document.getElementById("btn-open-modal").addEventListener("click", openFinanceModal);
document.getElementById("btn-profile-pill").addEventListener("click", openFinanceModal);
document.getElementById("btn-close-modal").addEventListener("click", closeFinanceModal);
document.getElementById("btn-modal-done").addEventListener("click", closeFinanceModal);

document.getElementById("btn-reset-data").addEventListener("click", () => {
  if (!confirm("确定把所有填写内容恢复成默认值吗？现在填的内容会被清掉。")) return;
  S = clone(DEFAULTS);
  save();
  renderModalContent();
  renderResults();
});

document.getElementById("btn-export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `退休规划数据-${todayStr}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

document.getElementById("btn-import").addEventListener("click", () => document.getElementById("file-import").click());
document.getElementById("file-import").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      S = sanitize(JSON.parse(reader.result));
      save();
      renderResults();
      alert("导入成功！已更新规划测算。");
    } catch (err) {
      alert("这个文件读不出来，请选择之前导出的 .json 文件。");
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});

document.getElementById("btn-image").addEventListener("click", () => {
  window.print();
});

// 初始化启动
renderResults();
</script>
</body>
</html>
